name: Daily Trackr 2027 Internship Scrape

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-trackr-sync
  cancel-in-progress: false

jobs:
  scrape-trackr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright & Chromium
        working-directory: scripts
        run: |
          npm install --no-audit --no-fund
          npx playwright install chromium --with-deps

      - name: Run Daily Trackr Scraper & Regenerate deadlines.ics
        working-directory: scripts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node daily-trackr.mjs

      - name: Commit and push updated state.json & deadlines.ics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json deadlines.ics
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Automated daily Trackr sync"
            git pull --rebase origin main
            git push origin main
          fi
