    function getCompanyInitials(company) {
      if (!company) return "??";
      const clean = company.replace(/\(.*?\)/g, "").replace(/[^a-zA-Z0-9&\s]/g, "").trim();
      if (clean.includes("&") && clean.length <= 6) return clean.replace(/\s+/g, "").slice(0, 3).toUpperCase();
      const parts = clean.split(/\s+/).filter(Boolean);
      if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
      return (parts[0][0] + parts[1][0]).toUpperCase();
    }

    function getMonogramStyle(company) {
      let hash = 0;
      for (let i = 0; i < (company || "").length; i++) {
        hash = company.charCodeAt(i) + ((hash << 5) - hash);

      return MONOGRAM_PALETTES[Math.abs(hash) % MONOGRAM_PALETTES.length];

      const merged = [];
      const seenIds = new Set();

      for (const savedItem of savedApps) {
        if (!savedItem || savedItem.id === undefined) continue;
        seenIds.add(savedItem.id);

        const initItem = initialApps.find(i => i.id === savedItem.id);
        if (!initItem) {
          const stage = validStageIds.has(savedItem.stage) ? savedItem.stage : "Application Submitted";
          merged.push({ ...savedItem, stage });
          continue;
        }

        const baselineSubStatus = savedItem._gmailSubStatus !== undefined ? savedItem._gmailSubStatus : initItem.subStatus;
        const baselineDeadline = savedItem._gmailDeadline !== undefined ? savedItem._gmailDeadline : initItem.deadline;

        const hasNewerGmailSubStatus = initItem.subStatus !== baselineSubStatus;
        const hasNewerGmailDeadline = initItem.deadline !== baselineDeadline;
        const hasNewerGmailUpdate = hasNewerGmailSubStatus || hasNewerGmailDeadline;

        const preservedStage = validStageIds.has(savedItem.stage) ? savedItem.stage : initItem.stage;
        const preservedNotes = (savedItem.notes !== undefined && savedItem.notes !== "")
          ? savedItem.notes
          : initItem.notes;

        merged.push({
          ...initItem,
          ...savedItem,
          stage: hasNewerGmailUpdate ? initItem.stage : preservedStage,
          rejectedAfterStage: hasNewerGmailUpdate
            ? (initItem.rejectedAfterStage || savedItem.rejectedAfterStage || null)
            : (savedItem.rejectedAfterStage || initItem.rejectedAfterStage || null),
          subStatus: hasNewerGmailSubStatus ? initItem.subStatus : (savedItem.subStatus ?? initItem.subStatus),
          deadline: hasNewerGmailDeadline ? initItem.deadline : (savedItem.deadline !== undefined ? savedItem.deadline : initItem.deadline),
          notes: preservedNotes,
          calendarSynced: hasNewerGmailDeadline ? initItem.calendarSynced : (savedItem.calendarSynced ?? initItem.calendarSynced),
          _gmailSubStatus: initItem.subStatus,
          _gmailDeadline: initItem.deadline
        });
      }

      for (const initItem of initialApps) {
        if (!seenIds.has(initItem.id)) {
          merged.push({
            ...initItem,
            _gmailSubStatus: initItem.subStatus,
            _gmailDeadline: initItem.deadline
          });
        }
      }

      return merged;
    }

    function loadMergedApps() {
      try {
        let raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          for (const legacyKey of LEGACY_STORAGE_KEYS) {
            const legacyRaw = localStorage.getItem(legacyKey);
            if (legacyRaw) {
              raw = legacyRaw;
              break;
            }
          }
        }
        if (!raw) {
          return smartMergeApps(INITIAL_APPLICATIONS, []);
        }
        const saved = JSON.parse(raw);
        return smartMergeApps(INITIAL_APPLICATIONS, saved);
      } catch {
        return smartMergeApps(INITIAL_APPLICATIONS, []);
      }
    }

    function formatCountdown(deadlineStr, appliedDateStr, now) {
      if (!deadlineStr) return null;
      const targetMs = new Date(deadlineStr).getTime();
      const startMs = appliedDateStr ? new Date(appliedDateStr + "T09:00:00").getTime() : targetMs - 5 * 86400000;
      const totalWindow = Math.max(targetMs - startMs, 3600000);
      const diff = targetMs - now;
      if (diff <= 0) {
        return { text: "WINDOW EXPIRED / CHECK PORTAL", urgent: true, expired: true, pctRemaining: 100 };
      }
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const mins = Math.floor((diff / (1000 * 60)) % 60);
      const secs = Math.floor((diff / 1000) % 60);
      const pctElapsed = Math.min(100, Math.max(8, Math.round(((totalWindow - diff) / totalWindow) * 100)));
      return {
        text: `${days > 0 ? days + 'd ' : ''}${String(hours).padStart(2,'0')}h ${String(mins).padStart(2,'0')}m ${String(secs).padStart(2,'0')}s`,
        urgent: days < 2,
        expired: false,
        pctElapsed
      };
    }

    function inferRejectedAfterStage(prevStage, existingRejectedAfter) {
      if (existingRejectedAfter) return existingRejectedAfter;
      if (prevStage === "Stage 3 - Assessment Centre") return "Stage 3 - Assessment Centre";
      if (prevStage === "Stage 2 - Video Interview") return "Stage 2 - Video Interview";
      if (prevStage === "Stage 1 - Online Assessment" || prevStage === "Action Required" || prevStage === "On Hold / Waitlist") {
        return "Stage 1 - Online Assessment";
      }
      return "CV / Application Screen";
    }

    function App() {
      const [apps, setApps] = useState(loadMergedApps);
      const [theme, setTheme] = useState(() => {
        try {
          const savedTheme = localStorage.getItem(THEME_STORAGE_KEY);
          return THEME_PRESETS.some(t => t.id === savedTheme) ? savedTheme : "carbon-gold";
        } catch {
          return "carbon-gold";
        }
      });
      const [now, setNow] = useState(Date.now());
      const [activeTab, setActiveTab] = useState("kanban");
      const [roleCategory, setRoleCategory] = useState("internship");
      const [search, setSearch] = useState("");
      const [sectorFilter, setSectorFilter] = useState("All");
      const [stageFilter, setStageFilter] = useState("All");
      const [rejectionFilter, setRejectionFilter] = useState("All");
      const [sortBy, setSortBy] = useState("newest");
      const [boardLayout, setBoardLayout] = useState("bento"); // "bento" (4x2 structured) or "swimlane" (horizontal)
      const [compactCards, setCompactCards] = useState(false);
      const [hideArchivedCols, setHideArchivedCols] = useState(false);
      const [radarCollapsed, setRadarCollapsed] = useState(false);

      const [selectedApp, setSelectedApp] = useState(null);
      const [showAddModal, setShowAddModal] = useState(false);
      const [calMonth, setCalMonth] = useState("2026-11");
      const [selectedDay, setSelectedDay] = useState("2026-11-18");

      // Drag and drop state
      const [draggedAppId, setDraggedAppId] = useState(null);
      const [dragOverStage, setDragOverStage] = useState(null);

      // Live Email Refresh state
      const [isRefreshing, setIsRefreshing] = useState(false);
      const [syncStatus, setSyncStatus] = useState(null);
      const restoreInputRef = React.useRef(null);

      const handleBackupJson = () => {
        try {
          const dateSlug = new Date().toISOString().slice(0, 10);
          const payload = {
            version: 4,
            exportedAt: new Date().toISOString(),
            theme,
            applications: apps
          };
          const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = `grad-tracker-2027-backup-${dateSlug}.json`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          setSyncStatus({
            ok: true,
            time: new Date().toLocaleTimeString("en-GB", { timeZone: "Europe/London" }),
            message: `Exported ${apps.length} applications to grad-tracker-2027-backup-${dateSlug}.json.`,
            emails: []
          });
        } catch {
          setSyncStatus({
            ok: false,
            time: new Date().toLocaleTimeString("en-GB", { timeZone: "Europe/London" }),
            message: "Failed to export JSON backup.",
            emails: []
          });
        }
      };

      const handleRestoreJson = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const parsed = JSON.parse(ev.target.result);
            const restoredApps = Array.isArray(parsed)
              ? parsed
              : (parsed && Array.isArray(parsed.applications) ? parsed.applications : null);
            if (!restoredApps || restoredApps.length === 0) {
              throw new Error("Invalid backup format");
            }
            if (parsed && parsed.theme && THEME_PRESETS.some(t => t.id === parsed.theme)) {
              setTheme(parsed.theme);
            }
            const merged = smartMergeApps(INITIAL_APPLICATIONS, restoredApps);
            setApps(merged);
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(merged)); } catch {}
            setSyncStatus({
              ok: true,
              time: new Date().toLocaleTimeString("en-GB", { timeZone: "Europe/London" }),
              message: `Restored & smart-merged ${merged.length} applications from ${file.name}.`,
              emails: []
            });
          } catch {
            setSyncStatus({
              ok: false,
              time: new Date().toLocaleTimeString("en-GB", { timeZone: "Europe/London" }),
              message: `Could not restore from ${file.name}: invalid JSON backup file.`,
              emails: []
            });
          } finally {
            e.target.value = "";
          }
        };
        reader.readAsText(file);
      };

      const [newApp, setNewApp] = useState({
        company: "", role: "", sector: "Investment Management",
        appliedDate: new Date().toISOString().slice(0, 10),
        stage: "Action Required", rejectedAfterStage: "CV / Application Screen",
        subStatus: "Stage 1: Online Assessment Invited",
        deadline: "", portalLink: "", notes: "", category: "internship"
      });

      useEffect(() => {
        const timer = setInterval(() => setNow(Date.now()), 1000);
        return () => clearInterval(timer);
      }, []);

      useEffect(() => {
        document.body.setAttribute("data-theme", theme);
        document.documentElement.classList.toggle("dark", theme !== "daylight");
        try { localStorage.setItem(THEME_STORAGE_KEY, theme); } catch {}
      }, [theme]);

      useEffect(() => {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(apps)); } catch {}
      }, [apps]);

      const currentThemeObj = useMemo(
        () => THEME_PRESETS.find(t => t.id === theme) || THEME_PRESETS[1],
        [theme]
      );

      const handleRefreshEmail = async () => {
        setIsRefreshing(true);
        try {
          let apiResult = null;
          try {
            const res = await fetch("/api/refresh", { method: "POST" });
            if (res.ok) {
              apiResult = await res.json();
            }
          } catch {}

          try {
            const htmlRes = await fetch(`/index.html?t=${Date.now()}`, { cache: "no-store" });
            if (htmlRes.ok) {
              const htmlText = await htmlRes.text();
              const match = htmlText.match(/\/\/ __INITIAL_APPLICATIONS_START__[\s\S]*?const INITIAL_APPLICATIONS = (\[[\s\S]*?\]);[\s\S]*?\/\/ __INITIAL_APPLICATIONS_END__/);
              if (match && match[1]) {
                const latestInitial = new Function(`return ${match[1]}`)();
                if (Array.isArray(latestInitial) && latestInitial.length > 0) {
                  setApps(prev => smartMergeApps(latestInitial, prev));
                }
              }
            }
          } catch {}

          const timeLabel = new Date().toLocaleTimeString("en-GB", { timeZone: "Europe/London" });
          if (apiResult && apiResult.ok) {
            setSyncStatus({
              ok: true,
              time: timeLabel,
              message: apiResult.message || `Synced with ramis.ahmad04@gmail.com (${apiResult.checkedCount || 0} recent emails checked).`,
              emails: apiResult.recentRelevantEmails || []
            });
          } else {
            setSyncStatus({
              ok: true,
              time: timeLabel,
              message: "Refreshed applications from latest Gmail sync in index.html.",
              emails: []
            });
          }
        } catch {
          setSyncStatus({
            ok: false,
            time: new Date().toLocaleTimeString("en-GB", { timeZone: "Europe/London" }),
            message: "Could not reach local Gmail refresh API; reloaded local tracker data.",
            emails: []
          });
        } finally {
          setIsRefreshing(false);
        }
      };

      const categoryApps = useMemo(() => {
        if (roleCategory === "successful") {
          return apps.filter(a => a.stage === "Offer / Successful");
        }
        return apps.filter(a => a.category === roleCategory);
      }, [apps, roleCategory]);
      const sectors = useMemo(() => ["All", ...new Set(categoryApps.map(a => a.sector))], [categoryApps]);

      const filteredApps = useMemo(() => {
        const list = categoryApps.filter(app => {
          const matchesSearch = app.company.toLowerCase().includes(search.toLowerCase()) ||
            app.role.toLowerCase().includes(search.toLowerCase()) ||
            app.subStatus.toLowerCase().includes(search.toLowerCase());
          const matchesSector = sectorFilter === "All" || app.sector === sectorFilter;
          const matchesStage = stageFilter === "All" || app.stage === stageFilter;
          const matchesRejection = rejectionFilter === "All" ||
            (app.stage === "Closed / Unsuccessful" && (app.rejectedAfterStage || "CV / Application Screen") === rejectionFilter);
          return matchesSearch && matchesSector && matchesStage && (activeTab !== "table" || rejectionFilter === "All" || matchesRejection);
        });

        return [...list].sort((a, b) => {
          if (sortBy === "company") return a.company.localeCompare(b.company);
          if (sortBy === "deadline") {
            const da = a.deadline || "9999-12-31";
            const db = b.deadline || "9999-12-31";
            return da.localeCompare(db) || b.appliedDate.localeCompare(a.appliedDate);
          }
          if (sortBy === "sector") return a.sector.localeCompare(b.sector) || a.company.localeCompare(b.company);
          // Default: newest appliedDate first
          return b.appliedDate.localeCompare(a.appliedDate) || a.company.localeCompare(b.company);
        });
      }, [categoryApps, search, sectorFilter, stageFilter, rejectionFilter, activeTab, sortBy]);

      const visibleStages = useMemo(() => {
        if (!hideArchivedCols) return STAGES;
        return STAGES.filter(s => s.id !== "Closed / Unsuccessful" && s.id !== "On Hold / Waitlist");
      }, [hideArchivedCols]);

      const urgentItems = useMemo(() => {
        return apps
          .filter(a => a.stage === "Action Required")
          .sort((a, b) => (a.deadline || "9999").localeCompare(b.deadline || "9999"));
      }, [apps]);

      const stats = useMemo(() => {
        const internships = apps.filter(a => a.category === "internship");
        const total = internships.length;
        const action = internships.filter(a => a.stage === "Action Required").length;
        const submitted = internships.filter(a => a.stage === "Application Submitted").length;
        const stage1 = internships.filter(a => a.stage === "Stage 1 - Online Assessment").length;
        const stage2 = internships.filter(a => a.stage === "Stage 2 - Video Interview").length;
        const stage3 = internships.filter(a => a.stage === "Stage 3 - Assessment Centre").length;
        const offers = internships.filter(a => a.stage === "Offer / Successful").length;
        const allOffers = apps.filter(a => a.stage === "Offer / Successful").length;
        const closed = internships.filter(a => a.stage === "Closed / Unsuccessful");
        const closedAfterOA = closed.filter(a => a.rejectedAfterStage === "Stage 1 - Online Assessment").length;
        const closedAfterVI = closed.filter(a => a.rejectedAfterStage === "Stage 2 - Video Interview").length;
        const closedAfterAC = closed.filter(a => a.rejectedAfterStage === "Stage 3 - Assessment Centre").length;
        const closedAfterCV = closed.length - closedAfterOA - closedAfterVI - closedAfterAC;
        const active = internships.filter(a => a.stage !== "Closed / Unsuccessful").length;
        const everReachedStage1Plus = action + stage1 + stage2 + stage3 + offers + closedAfterOA + closedAfterVI + closedAfterAC;
        const progressionRate = total > 0 ? Math.round((everReachedStage1Plus / total) * 100) : 0;
        return {
          total, action, submitted, stage1, stage2, stage3, offers, allOffers, active,
          everReachedStage1Plus, progressionRate,
          closedTotal: closed.length, closedAfterCV, closedAfterOA, closedAfterVI, closedAfterAC
        };
      }, [apps]);

      const updateAppStage = (id, newStage) => {
        setApps(prev => prev.map(a => {
          if (a.id !== id) return a;
          const nextRejected = newStage === "Closed / Unsuccessful"
            ? inferRejectedAfterStage(a.stage, a.rejectedAfterStage)
            : a.rejectedAfterStage;
          return { ...a, stage: newStage, rejectedAfterStage: nextRejected };
        }));
        if (selectedApp && selectedApp.id === id) {
          setSelectedApp(prev => ({
            ...prev,
            stage: newStage,
            rejectedAfterStage: newStage === "Closed / Unsuccessful"
              ? inferRejectedAfterStage(prev.stage, prev.rejectedAfterStage)
              : prev.rejectedAfterStage
          }));
        }
      };

      const handleDragStart = (e, appId) => {
        setDraggedAppId(appId);
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("text/plain", String(appId));
      };

      const handleDragOver = (e, stageId) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = "move";
        if (dragOverStage !== stageId) setDragOverStage(stageId);
      };

      const handleDrop = (e, targetStageId) => {
        e.preventDefault();
        const rawId = e.dataTransfer.getData("text/plain");
        const id = draggedAppId || Number(rawId);
        if (id) {
          updateAppStage(id, targetStageId);
        }
        setDraggedAppId(null);
        setDragOverStage(null);
      };

      const handleSaveEdit = (updated) => {
        setApps(prev => prev.map(a => a.id === updated.id ? updated : a));
        setSelectedApp(null);
      };

      const handleAddApp = (e) => {
        e.preventDefault();
        if (!newApp.company || !newApp.role) return;
        const item = {
          ...newApp,
          id: Date.now(),
          deadline: newApp.deadline || null,
          calendarSynced: Boolean(newApp.deadline),
          rejectedAfterStage: newApp.stage === "Closed / Unsuccessful" ? (newApp.rejectedAfterStage || "CV / Application Screen") : null
        };
        setApps(prev => [item, ...prev]);
        setShowAddModal(false);
        setNewApp({
          company: "", role: "", sector: "Investment Management",
          appliedDate: new Date().toISOString().slice(0, 10),
          stage: "Action Required", rejectedAfterStage: "CV / Application Screen",
          subStatus: "Stage 1: Online Assessment Invited",
          deadline: "", portalLink: "", notes: "", category: roleCategory
        });
      };

      const resetData = () => {
        if (confirm("Reset dashboard back to the synced Gmail applications (Sept–Nov 2026) in index.html?")) {
          setApps(INITIAL_APPLICATIONS);
          localStorage.removeItem(STORAGE_KEY);
        }
      };

      // Calendar Grid Builder
      const calendarDays = useMemo(() => {
        const [year, month] = calMonth.split("-").map(Number);
        const firstDay = new Date(year, month - 1, 1).getDay();
        const startOffset = (firstDay + 6) % 7; // Monday start
        const daysInMonth = new Date(year, month, 0).getDate();
        const cells = [];
        for (let i = 0; i < startOffset; i++) cells.push(null);
        for (let d = 1; d <= daysInMonth; d++) {
          const dateStr = `${year}-${String(month).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
          const deadlines = apps.filter(a => a.deadline && a.deadline.startsWith(dateStr));
          const applied = apps.filter(a => a.appliedDate === dateStr);
          cells.push({ day: d, dateStr, deadlines, applied });
        }
        return cells;
      }, [calMonth, apps]);

      return (
        <div className="min-h-screen pb-16 selection:bg-indigo-500/30 selection:text-indigo-200">
          {/* Top Command Header */}
          <header className="sticky top-0 z-30 theme-header backdrop-blur-2xl px-4 md:px-8 py-3.5 shadow-lg">
            <div className="max-w-[1640px] mx-auto flex flex-wrap items-center justify-between gap-4">
              <div className="flex items-center gap-3.5">
                <div className="w-9 h-9 rounded-xl theme-accent-btn flex items-center justify-center shadow-lg">
                  <Icon name="Terminal" className="w-4 h-4" />
                </div>
                <div>
                  <div className="flex items-center gap-2.5">
                    <h1 className="text-base md:text-lg font-extrabold tracking-tight text-white">2027 GRAD & INTERNSHIP COMMAND</h1>
                    <span className="hidden sm:inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-emerald-500/10 text-emerald-300 border border-emerald-500/25">
                      <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 shadow-[0_0_8px_#34d399] animate-pulse"></span>
                      Gmail (Sept–Nov) + GCal Synced
                    </span>
                  </div>
                  <p className="text-xs text-slate-400 font-medium">Ramis Ahmad • BSc Physics (Exeter) • Client, Markets & Strategy Track</p>
                </div>
              </div>

              <div className="flex flex-wrap items-center gap-2">
                {/* Compact Theme Switcher Dropdown */}
                <div className="glass-surface rounded-xl px-2.5 py-1.5 flex items-center gap-2">
                  <span
                    className="w-3 h-3 rounded-full border shrink-0 shadow-sm"
                    style={{ backgroundColor: currentThemeObj.accent, borderColor: currentThemeObj.border }}
                    title={`Active Theme: ${currentThemeObj.label}`}
                  />
                  <Icon name="Palette" className="w-3.5 h-3.5 text-slate-400" />
                  <select
                    aria-label="Theme Switcher"
                    value={theme}
                    onChange={e => setTheme(e.target.value)}
                    className="bg-transparent text-xs font-semibold text-white focus:outline-none cursor-pointer pr-1"
                  >
                    {THEME_PRESETS.map(preset => (
                      <option key={preset.id} value={preset.id} className="bg-slate-900 text-slate-100">
                        {preset.label}
                      </option>
                    ))}
                  </select>
                </div>

                <div className="glass-surface rounded-xl p-1 flex flex-wrap text-xs">
                  <button
                    onClick={() => { setRoleCategory("internship"); setSectorFilter("All"); }}
                    className={`px-3 py-1.5 rounded-lg font-semibold transition-all ${roleCategory === "internship" ? "theme-accent-btn shadow-md" : "text-slate-400 hover:text-white"}`}
                  >
                    2027 Internships & Grad ({apps.filter(a => a.category === "internship").length})
                  </button>
                  <button
                    onClick={() => { setRoleCategory("parttime"); setSectorFilter("All"); }}
                    className={`px-3 py-1.5 rounded-lg font-semibold transition-all ${roleCategory === "parttime" ? "theme-accent-btn shadow-md" : "text-slate-400 hover:text-white"}`}
                  >
                    Part-Time & Flex ({apps.filter(a => a.category === "parttime").length})
                  </button>
                  <button
                    onClick={() => { setRoleCategory("successful"); setSectorFilter("All"); }}
                    className={`px-3 py-1.5 rounded-lg font-semibold transition-all flex items-center gap-1.5 ${roleCategory === "successful" ? "bg-lime-500/25 text-lime-200 shadow-md border border-lime-400/40" : "text-lime-300/80 hover:text-lime-200"}`}
                  >
                    <span className="w-1.5 h-1.5 rounded-full bg-lime-400 shadow-[0_0_6px_#a3e635]"></span>
                    Successful / Offers ({apps.filter(a => a.stage === "Offer / Successful").length})
                  </button>
                </div>

                <button
                  onClick={handleBackupJson}
                  title="Export all applications and edits as a JSON backup file"
                  className="flex items-center gap-1.5 glass-surface hover:border-current text-white font-semibold text-xs px-3 py-2 rounded-xl transition-all"
                >
                  <Icon name="Download" className="w-3.5 h-3.5" />
                  Backup JSON
                </button>

                <button
                  onClick={() => restoreInputRef.current && restoreInputRef.current.click()}
                  title="Restore and smart-merge applications from a JSON backup file"
                  className="flex items-center gap-1.5 glass-surface hover:border-current text-white font-semibold text-xs px-3 py-2 rounded-xl transition-all"
                >
                  <Icon name="Upload" className="w-3.5 h-3.5" />
                  Restore JSON
                </button>
                <input
                  ref={restoreInputRef}
                  type="file"
                  accept=".json,application/json"
                  onChange={handleRestoreJson}
                  className="hidden"
                />

                <button
                  onClick={handleRefreshEmail}
                  disabled={isRefreshing}
                  className="flex items-center gap-1.5 glass-surface hover:border-current disabled:opacity-60 text-white font-semibold text-xs px-3.5 py-2 rounded-xl transition-all"
                >
                  <Icon name="RefreshCw" className={`w-3.5 h-3.5 ${isRefreshing ? "animate-spin" : ""}`} />
                  {isRefreshing ? "Checking Gmail..." : "Refresh & Check Email"}
                </button>

                <button
                  onClick={() => setShowAddModal(true)}
                  className="flex items-center gap-1.5 theme-accent-btn font-bold text-xs px-3.5 py-2 rounded-xl transition-all shadow-lg"
                >
                  <Icon name="Plus" className="w-4 h-4" />
                  Add Role
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-[1640px] mx-auto px-4 md:px-8 pt-6 space-y-5">
            {/* Live Gmail Refresh Status Banner */}
            {syncStatus && (
              <div className={`glass-surface rounded-2xl p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 border ${
                syncStatus.ok ? "border-emerald-500/35 bg-emerald-950/25 text-emerald-200" : "border-amber-500/35 bg-amber-950/25 text-amber-200"
              }`}>

                                {/* Sub-status & Countdown Footer Box */}
                                <div className="text-[11px] text-slate-300 theme-input rounded-lg px-2.5 py-1.5 flex items-center justify-between gap-2">
                                  <span className="truncate">{app.subStatus}</span>
                                  {cd && (
                                    <span className={`text-[10px] font-mono-num font-bold shrink-0 ${
                                      cd.expired ? "text-rose-400" : "text-amber-300"
                                    }`}>
                                      {cd.expired ? "DUE" : cd.text.split(" ")[0]}
                                    </span>
                                  )}
                                  {app.calendarSynced && !cd && (
                                    <span className="text-[9px] font-mono-num text-sky-300 shrink-0">GCal</span>
                                  )}
                                </div>
                              </div>
                            );
                          })}

                          {colApps.length === 0 && (
                            <div className="text-center py-10 px-4 text-xs text-slate-500 border border-dashed border-white/[0.08] rounded-xl space-y-1">
                              <div className="font-semibold text-slate-400">
                                {stage.isFinalGoal ? "Drag Offers & Contracts Here" : "No Roles in Stage"}
                              </div>
                              <div className="text-[11px]">Drop any card here to move to {stage.label}</div>
                            </div>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* VIEW 2: MASTER TABLE */}
            {activeTab === "table" && (
              <div className="glass-surface rounded-2xl overflow-hidden">
                <div className="overflow-x-auto">
                  <table className="w-full text-left border-collapse">
                    <thead>
                      <tr className="border-b border-white/[0.08] text-[11px] uppercase tracking-wider text-slate-400">
                        <th className="py-3.5 px-4">Company</th>
                        <th className="py-3.5 px-4">Role</th>
                        <th className="py-3.5 px-4">Sector</th>
                        <th className="py-3.5 px-4">Applied</th>
                        <th className="py-3.5 px-4">Pipeline Stage</th>
                        <th className="py-3.5 px-4">Unsuccessful After</th>
                        <th className="py-3.5 px-4">Current Status / Deadline</th>
                        <th className="py-3.5 px-4 text-right">Actions</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-white/[0.06] text-xs">
                      {filteredApps.map(app => {
                        const stageObj = STAGES.find(s => s.id === app.stage) || STAGES[1];
                        const rejObj = app.stage === "Closed / Unsuccessful" ? getRejectionBadge(app.rejectedAfterStage) : null;
                        return (
                          <tr key={app.id} className="hover:bg-white/[0.04] transition">
                            <td className="py-3 px-4 font-bold text-white whitespace-nowrap">
                              <div className="flex items-center gap-2.5">
                                <CompanyMonogram company={app.company} />
                                <span>{app.company}</span>
                              </div>
                            </td>
                            <td className="py-3 px-4 text-slate-300 max-w-xs truncate">{app.role}</td>
                            <td className="py-3 px-4 text-slate-400 whitespace-nowrap">{app.sector}</td>
                            <td className="py-3 px-4 font-mono-num text-slate-400 whitespace-nowrap">{app.appliedDate}</td>
                            <td className="py-3 px-4 whitespace-nowrap">
                              <select
                                value={app.stage}
                                onChange={e => updateAppStage(app.id, e.target.value)}
                                className={`text-[11px] font-semibold px-2.5 py-1 rounded-lg border theme-input focus:outline-none ${stageObj.badge}`}
                              >
                                {STAGES.map(s => <option key={s.id} value={s.id} className="bg-slate-900 text-slate-200">{s.step} · {s.label}</option>)}
                              </select>
                            </td>
                            <td className="py-3 px-4 whitespace-nowrap">
                              {rejObj ? (
                                <span className={`inline-flex items-center gap-1.5 text-[11px] font-semibold px-2.5 py-0.5 rounded-lg border ${rejObj.badge}`}>
                                  <span className={`w-1.5 h-1.5 rounded-full ${rejObj.dot}`}></span>
                                  {rejObj.shortLabel}
                                </span>
                              ) : (
                                <span className="text-slate-500 font-mono-num">—</span>
                              )}
                            </td>
                            <td className="py-3 px-4 text-slate-300 max-w-xs truncate">{app.subStatus}</td>
                            <td className="py-3 px-4 text-right whitespace-nowrap space-x-2.5">
                              <button onClick={() => setSelectedApp(app)} className="theme-accent-text hover:underline font-semibold">
                                Details
                              </button>
                              {app.portalLink && (
                                <a href={app.portalLink} target="_blank" rel="noreferrer" className="text-emerald-400 hover:underline font-semibold">
                                  Portal ↗
                                </a>
                              )}
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* VIEW 3: INTERACTIVE CALENDAR (SEPT–DEC 2026) */}
            {activeTab === "calendar" && (
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-5">
                <div className="lg:col-span-2 glass-surface rounded-2xl p-5">
                  <div className="flex flex-wrap items-center justify-between gap-2 mb-4">
                    <h2 className="text-sm font-bold text-white">Application & Assessment Schedule (Sept–Dec 2026)</h2>
                    <div className="flex gap-1.5">
                      {[
                        { id: "2026-09", label: "Sep 2026" },
                        { id: "2026-10", label: "Oct 2026" },
                        { id: "2026-11", label: "Nov 2026" },
                        { id: "2026-12", label: "Dec 2026" }
                      ].map(m => (
                        <button
                          key={m.id}
                          onClick={() => setCalMonth(m.id)}
                          className={`px-3 py-1 rounded-xl text-xs font-semibold transition ${
                            calMonth === m.id ? "theme-accent-btn shadow-md" : "theme-input text-slate-400 hover:text-white"
                          }`}
                        >
                          {m.label}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="grid grid-cols-7 gap-1.5 text-center text-[11px] font-semibold text-slate-500 mb-1.5">
                    {["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].map(d => <div key={d}>{d}</div>)}
                  </div>

                  <div className="grid grid-cols-7 gap-1.5">
                    {calendarDays.map((cell, idx) => {
                      if (!cell) return <div key={idx} className="h-20 rounded-xl opacity-30 theme-input" />;
                      const isToday = cell.dateStr === "2026-11-18";
                      const isSelected = cell.dateStr === selectedDay;
                      return (
                        <div
                          key={cell.dateStr}
                          onClick={() => setSelectedDay(cell.dateStr)}
                          className={`h-20 rounded-xl p-1.5 border cursor-pointer transition flex flex-col justify-between ${
                            isSelected
                              ? "ring-2 ring-amber-400/70 glass-card"
                              : isToday
                              ? "border-emerald-500/60 glass-card"
                              : "glass-card"
                          }`}
                        >
                          <div className="flex items-center justify-between">
                            <span className={`text-xs font-mono-num font-bold ${isToday ? "text-emerald-400" : "text-slate-300"}`}>
                              {cell.day}
                            </span>
                            {isToday && <span className="text-[9px] uppercase font-bold text-emerald-400">Today</span>}
                          </div>

                          <div className="space-y-1 overflow-hidden">
                            {cell.deadlines.map(d => (
                              <div key={d.id} className="text-[10px] truncate px-1 py-0.5 rounded bg-amber-500/20 text-amber-300 font-medium">
                                DUE: {d.company}
                              </div>
                            ))}
                            {cell.applied.length > 0 && (
                              <div className="text-[10px] font-mono-num truncate px-1 py-0.5 rounded bg-indigo-500/20 text-indigo-300">
                                +{cell.applied.length} Applied
                              </div>
                            )}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* Selected Day Agenda */}
                <div className="glass-surface rounded-2xl p-5 space-y-4">
                  <div className="border-b border-white/[0.08] pb-3">
                    <div className="text-xs text-slate-400">Selected Date</div>
                    <div className="text-base font-bold text-white font-mono-num mt-0.5">{selectedDay}</div>
                  </div>

                  {(() => {
                    const dayDeadlines = apps.filter(a => a.deadline && a.deadline.startsWith(selectedDay));
                    const dayApplied = apps.filter(a => a.appliedDate === selectedDay);
                    if (dayDeadlines.length === 0 && dayApplied.length === 0) {
                      return <p className="text-xs text-slate-500 py-6 text-center">No logged submissions or assessment deadlines on this date.</p>;
                    }
                    return (
                      <div className="space-y-3">
                        {dayDeadlines.map(d => (
                          <div key={d.id} className="bg-amber-500/10 border border-amber-500/30 rounded-xl p-3 space-y-1.5">
                            <div className="text-[11px] font-bold uppercase text-amber-400">Assessment / Action Deadline</div>
                            <div className="flex items-center gap-2">
                              <CompanyMonogram company={d.company} />
                              <div className="text-sm font-bold text-white">{d.company}</div>
                            </div>
                            <div className="text-xs text-slate-300">{d.subStatus}</div>
                            <div className="text-[11px] font-mono-num text-amber-300 pt-1">Due: {d.deadline.replace("T", " ")}</div>
                          </div>
                        ))}
                        {dayApplied.map(a => (
                          <div key={a.id} onClick={() => setSelectedApp(a)} className="glass-card rounded-xl p-3 cursor-pointer space-y-1">
                            <div className="text-[10px] uppercase font-semibold text-indigo-400">Application Submitted</div>
                            <div className="flex items-center gap-2">
                              <CompanyMonogram company={a.company} />
                              <div className="text-xs font-bold text-white">{a.company}</div>
                            </div>
                            <div className="text-[11px] text-slate-400 truncate">{a.role}</div>
                          </div>
                        ))}
                      </div>
                    );
                  })()}
                </div>
              </div>
            )}

            {/* VIEW 4: ANALYTICS, FUNNEL & UNSUCCESSFUL STAGE BREAKDOWN */}
            {activeTab === "analytics" && (
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-5">
                <div className="glass-surface rounded-2xl p-5 space-y-4">
                  <h3 className="text-sm font-bold text-white">2027 Pipeline Breakdown (01 → 08 Offer / Successful)</h3>
                  <div className="space-y-3.5">
                    {STAGES.map(st => {
                      const count = apps.filter(a => a.category === "internship" && a.stage === st.id).length;
                      const pct = Math.round((count / Math.max(stats.total, 1)) * 100);
                      return (
                        <div key={st.id} className="space-y-1.5">
                          <div className="flex justify-between text-xs">
                            <span className="text-slate-300 font-medium flex items-center gap-2">
                              <span className={`w-2 h-2 rounded-full ${st.dotColor}`}></span>
                              <span className="font-mono-num text-[11px] text-slate-400">{st.step}</span>
                              {st.label}
                            </span>
                            <span className="font-mono-num text-slate-300 font-semibold">{count} ({pct}%)</span>
                          </div>
                          <div className="w-full h-2 theme-input rounded-full overflow-hidden">
                            <div className={`h-full ${st.barColor || "bg-indigo-500"} rounded-full`} style={{ width: `${pct}%` }} />
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* Unsuccessful By Stage Reached Breakdown */}
                <div className="glass-surface rounded-2xl p-5 space-y-4">
                  <div className="flex items-center justify-between">
                    <h3 className="text-sm font-bold text-white">Unsuccessful Breakdown by Stage Reached</h3>
                    <span className="text-xs font-mono-num text-slate-400">{stats.closedTotal} Closed</span>
                  </div>
                  <p className="text-xs text-slate-400">
                    Differentiates between applications closed at initial CV review vs after completing Stage 1 Online Assessments or Stage 2 Video Interviews.
                  </p>
                  <div className="space-y-3.5 pt-1">
                    {[
                      { id: "CV / Application Screen", label: "After CV / Application Screen", count: stats.closedAfterCV, bar: "bg-slate-400", dot: "bg-slate-400" },
                      { id: "Stage 1 - Online Assessment", label: "After Stage 1 (Online Assessment)", count: stats.closedAfterOA, bar: "bg-cyan-400", dot: "bg-cyan-400" },
                      { id: "Stage 2 - Video Interview", label: "After Stage 2 (Video Interview)", count: stats.closedAfterVI, bar: "bg-emerald-400", dot: "bg-emerald-400" },
                      { id: "Stage 3 - Assessment Centre", label: "After Stage 3 (Assessment Centre)", count: stats.closedAfterAC, bar: "bg-fuchsia-400", dot: "bg-fuchsia-400" }
                    ].map(row => {
                      const pct = Math.round((row.count / Math.max(stats.closedTotal, 1)) * 100);
                      const matchingFirms = apps
                        .filter(a => a.category === "internship" && a.stage === "Closed / Unsuccessful" && (a.rejectedAfterStage || "CV / Application Screen") === row.id)
                        .map(a => a.company);
                      return (
                        <div key={row.id} className="glass-card rounded-xl p-3 space-y-2">
                          <div className="flex justify-between text-xs">
                            <span className="text-slate-200 font-semibold flex items-center gap-2">
                              <span className={`w-2 h-2 rounded-full ${row.dot}`}></span>
                              {row.label}
                            </span>
                            <span className="font-mono-num text-white font-bold">{row.count} ({pct}%)</span>
                          </div>
                          <div className="w-full h-1.5 theme-input rounded-full overflow-hidden">
                            <div className={`h-full ${row.bar} rounded-full`} style={{ width: `${pct}%` }} />
                          </div>
                          {matchingFirms.length > 0 && (
                            <div className="flex flex-wrap gap-1 pt-0.5">
                              {matchingFirms.map(firm => (
                                <span key={firm} className="text-[10px] px-2 py-0.5 rounded-md theme-input text-slate-300">
                                  {firm}
                                </span>
                              ))}
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>

                <div className="glass-surface rounded-2xl p-5 space-y-4">
                  <h3 className="text-sm font-bold text-white">Applications by Target Sector</h3>
                  <div className="space-y-3">
                    {[...new Set(apps.filter(a => a.category === "internship").map(a => a.sector))].map(sec => {
                      const count = apps.filter(a => a.category === "internship" && a.sector === sec).length;
                      const pct = Math.round((count / Math.max(stats.total, 1)) * 100);
                      return (
                        <div key={sec} className="space-y-1">
                          <div className="flex justify-between text-xs">
                            <span className="text-slate-300 font-medium">{sec}</span>
                            <span className="font-mono-num text-slate-400">{count} ({pct}%)</span>
                          </div>
                          <div className="w-full h-2 theme-input rounded-full overflow-hidden">
                            <div className="h-full bg-emerald-500 rounded-full" style={{ width: `${pct}%` }} />
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* Edit / Detail Modal */}
          {selectedApp && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4" onClick={() => setSelectedApp(null)}>
              <div className="glass-surface rounded-2xl max-w-lg w-full p-6 space-y-4 shadow-2xl" onClick={e => e.stopPropagation()}>
                <div className="flex items-start justify-between gap-3">
                  <div className="flex items-start gap-3">
                    <CompanyMonogram company={selectedApp.company} />
                    <div>
                      <span className="text-[11px] font-semibold uppercase tracking-wider theme-accent-text">{selectedApp.sector}</span>
                      <h3 className="text-lg font-bold text-white mt-0.5">{selectedApp.company}</h3>
                      <p className="text-xs text-slate-400 mt-0.5">{selectedApp.role}</p>
                    </div>
                  </div>
                  <button onClick={() => setSelectedApp(null)} className="text-slate-400 hover:text-white p-1">
                    <Icon name="X" className="w-5 h-5" />
                  </button>
                </div>

                <div className="grid grid-cols-2 gap-3 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1">Pipeline Stage</label>
                    <select
                      value={selectedApp.stage}
                      onChange={e => {
                        const nextStage = e.target.value;
                        setSelectedApp({
                          ...selectedApp,
                          stage: nextStage,
                          rejectedAfterStage: nextStage === "Closed / Unsuccessful"
                            ? inferRejectedAfterStage(selectedApp.stage, selectedApp.rejectedAfterStage)
                            : selectedApp.rejectedAfterStage
                        });
                      }}
                      className="w-full theme-input rounded-xl px-2.5 py-2"
                    >
                      {STAGES.map(s => <option key={s.id} value={s.id}>{s.step} · {s.label}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1">Deadline (ISO / Local)</label>
                    <input
                      type="text"
                      value={selectedApp.deadline || ""}
                      placeholder="YYYY-MM-DDTHH:MM:SS"
                      onChange={e => setSelectedApp({ ...selectedApp, deadline: e.target.value || null })}
                      className="w-full theme-input rounded-xl px-2.5 py-2 font-mono-num"
                    />
                  </div>
                </div>

                {selectedApp.stage === "Closed / Unsuccessful" && (
                  <div className="text-xs">
                    <label className="block text-rose-400 font-semibold mb-1">Unsuccessful After Which Stage?</label>
                    <select
                      value={selectedApp.rejectedAfterStage || "CV / Application Screen"}
                      onChange={e => setSelectedApp({ ...selectedApp, rejectedAfterStage: e.target.value })}
                      className="w-full theme-input rounded-xl px-2.5 py-2"
                    >
                      {REJECTION_STAGES.map(r => (
                        <option key={r.id} value={r.id}>{r.label}</option>
                      ))}
                    </select>
                  </div>
                )}

                <div className="text-xs">
                  <label className="block text-slate-400 mb-1">Current Sub-Status</label>
                  <input
                    type="text"
                    value={selectedApp.subStatus}
                    onChange={e => setSelectedApp({ ...selectedApp, subStatus: e.target.value })}
                    className="w-full theme-input rounded-xl px-3 py-2"
                  />
                </div>

                <div className="text-xs">
                  <label className="block text-slate-400 mb-1">Notes & Assessment Details</label>
                  <textarea
                    rows={3}
                    value={selectedApp.notes}
                    onChange={e => setSelectedApp({ ...selectedApp, notes: e.target.value })}
                    className="w-full theme-input rounded-xl px-3 py-2"
                  />
                </div>

                <div className="flex items-center justify-between pt-2">
                  {selectedApp.portalLink ? (
                    <a href={selectedApp.portalLink} target="_blank" rel="noreferrer" className="text-xs text-emerald-400 hover:underline flex items-center gap-1 font-semibold">
                      Open Candidate Portal <Icon name="ExternalLink" className="w-3.5 h-3.5" />
                    </a>
                  ) : <span />}
                  <div className="flex gap-2">
                    <button onClick={() => setSelectedApp(null)} className="px-3.5 py-2 rounded-xl text-xs text-slate-400 hover:text-white">
                      Cancel
                    </button>
                    <button onClick={() => handleSaveEdit(selectedApp)} className="px-4 py-2 rounded-xl text-xs font-bold theme-accent-btn shadow-lg">
                      Save Changes
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Add New Role Modal */}
          {showAddModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4" onClick={() => setShowAddModal(false)}>
              <form onSubmit={handleAddApp} className="glass-surface rounded-2xl max-w-lg w-full p-6 space-y-4 shadow-2xl" onClick={e => e.stopPropagation()}>
                <div className="flex items-center justify-between">
                  <h3 className="text-base font-bold text-white">Add New Application</h3>
                  <button type="button" onClick={() => setShowAddModal(false)} className="text-slate-400 hover:text-white">
                    <Icon name="X" className="w-5 h-5" />
                  </button>
                </div>

                <div className="grid grid-cols-2 gap-3 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1">Company *</label>
                    <input required type="text" value={newApp.company} onChange={e => setNewApp({ ...newApp, company: e.target.value })} className="w-full theme-input rounded-xl px-3 py-2" />
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1">Sector</label>
                    <input type="text" value={newApp.sector} onChange={e => setNewApp({ ...newApp, sector: e.target.value })} className="w-full theme-input rounded-xl px-3 py-2" />
                  </div>
                </div>

                <div className="text-xs">
                  <label className="block text-slate-400 mb-1">Role Title *</label>
                  <input required type="text" value={newApp.role} onChange={e => setNewApp({ ...newApp, role: e.target.value })} className="w-full theme-input rounded-xl px-3 py-2" />
                </div>

                <div className="grid grid-cols-2 gap-3 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1">Stage</label>
                    <select value={newApp.stage} onChange={e => setNewApp({ ...newApp, stage: e.target.value })} className="w-full theme-input rounded-xl px-2.5 py-2">
                      {STAGES.map(s => <option key={s.id} value={s.id}>{s.step} · {s.label}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1">Deadline (Optional)</label>
                    <input type="datetime-local" value={newApp.deadline} onChange={e => setNewApp({ ...newApp, deadline: e.target.value })} className="w-full theme-input rounded-xl px-2.5 py-2 font-mono-num" />
                  </div>
                </div>

                {newApp.stage === "Closed / Unsuccessful" && (
                  <div className="text-xs">
                    <label className="block text-rose-400 font-semibold mb-1">Unsuccessful After Which Stage?</label>
                    <select
                      value={newApp.rejectedAfterStage || "CV / Application Screen"}
                      onChange={e => setNewApp({ ...newApp, rejectedAfterStage: e.target.value })}
                      className="w-full theme-input rounded-xl px-2.5 py-2"
                    >
                      {REJECTION_STAGES.map(r => (
                        <option key={r.id} value={r.id}>{r.label}</option>
                      ))}
                    </select>
                  </div>
                )}

                <div className="text-xs">
                  <label className="block text-slate-400 mb-1">Portal / Assessment Link</label>
                  <input type="url" value={newApp.portalLink} onChange={e => setNewApp({ ...newApp, portalLink: e.target.value })} placeholder="https://..." className="w-full theme-input rounded-xl px-3 py-2" />
                </div>

                <div className="text-xs">
                  <label className="block text-slate-400 mb-1">Notes</label>
                  <textarea rows={2} value={newApp.notes} onChange={e => setNewApp({ ...newApp, notes: e.target.value })} className="w-full theme-input rounded-xl px-3 py-2" />
                </div>

                <div className="flex justify-end gap-2 pt-2">
                  <button type="button" onClick={() => setShowAddModal(false)} className="px-3.5 py-2 rounded-xl text-xs text-slate-400">Cancel</button>
                  <button type="submit" className="px-4 py-2 rounded-xl text-xs font-bold theme-accent-btn">Add to Tracker</button>
                </div>
              </form>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
