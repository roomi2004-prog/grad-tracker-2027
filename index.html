      const ref = React.useRef(null);
      useEffect(() => {
        if (ref.current && window.lucide) {
          const iconNode = window.lucide.icons[name];
          if (iconNode) {
            ref.current.innerHTML = '';
            const svg = window.lucide.createElement(iconNode);
            svg.setAttribute('class', className);
            ref.current.appendChild(svg);
          }
        }
      }, [name, className]);
      return <span ref={ref} className="inline-flex items-center justify-center shrink-0" />;
    };

    const MONOGRAM_PALETTES = [
      "from-indigo-500/90 to-violet-600/90 text-white border-indigo-400/30 shadow-indigo-500/20",
      "from-emerald-500/90 to-teal-600/90 text-white border-emerald-400/30 shadow-emerald-500/20",
      "from-cyan-500/90 to-blue-600/90 text-white border-cyan-400/30 shadow-cyan-500/20",
      "from-amber-500/90 to-orange-600/90 text-white border-amber-400/30 shadow-amber-500/20",
      "from-fuchsia-500/90 to-pink-600/90 text-white border-fuchsia-400/30 shadow-fuchsia-500/20",
      "from-sky-500/90 to-indigo-600/90 text-white border-sky-400/30 shadow-sky-500/20",
      "from-rose-500/90 to-red-600/90 text-white border-rose-400/30 shadow-rose-500/20"
    ];

    function getCompanyInitials(company) {
      if (!company) return "??";
      const clean = company.replace(/\(.*?\)/g, "").replace(/[^a-zA-Z0-9&\s]/g, "").trim();
      if (clean.includes("&") && clean.length <= 6) return clean.replace(/\s+/g, "").slice(0, 3).toUpperCase();
      const parts = clean.split(/\s+/).filter(Boolean);
      if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
      return (parts[0][0] + parts[1][0]).toUpperCase();
    }

    function getMonogramStyle(company) {
      let hash = 0;
      for (let i = 0; i < (company || "").length; i++) {
        hash = company.charCodeAt(i) + ((hash << 5) - hash);
      }
      return MONOGRAM_PALETTES[Math.abs(hash) % MONOGRAM_PALETTES.length];
    }

    const CompanyMonogram = ({ company }) => {
      const initials = getCompanyInitials(company);
      const gradientClass = getMonogramStyle(company);
      return (

    function loadMergedApps() {
      try {

        if (!raw) return INITIAL_APPLICATIONS;
        const saved = JSON.parse(raw);
        if (!Array.isArray(saved)) return INITIAL_APPLICATIONS;
        const initialById = new Map(INITIAL_APPLICATIONS.map(item => [item.id, item]));
        const savedById = new Map(saved.map(item => [item.id, item]));
        const merged = INITIAL_APPLICATIONS.map(initItem => {
          const s = savedById.get(initItem.id);
          if (!s) return initItem;
          const validStage = STAGES.some(st => st.id === s.stage) ? s.stage : initItem.stage;
          return {
            ...initItem,
            ...s,
            stage: validStage,
            rejectedAfterStage: s.rejectedAfterStage || initItem.rejectedAfterStage || null
          };
        });
        for (const s of saved) {
          if (!initialById.has(s.id)) {
            const validStage = STAGES.some(st => st.id === s.stage) ? s.stage : "Application Submitted";
            merged.unshift({ ...s, stage: validStage });
          }
        }
        return merged;
      } catch {
        return INITIAL_APPLICATIONS;
      }
    }

    function formatCountdown(deadlineStr, appliedDateStr, now) {
      if (!deadlineStr) return null;
      const targetMs = new Date(deadlineStr).getTime();
      const startMs = appliedDateStr ? new Date(appliedDateStr + "T09:00:00").getTime() : targetMs - 5 * 86400000;
      const totalWindow = Math.max(targetMs - startMs, 3600000);
      const diff = targetMs - now;
      if (diff <= 0) {
        return { text: "WINDOW EXPIRED / CHECK PORTAL", urgent: true, expired: true, pctRemaining: 100 };
      }
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const mins = Math.floor((diff / (1000 * 60)) % 60);
      const secs = Math.floor((diff / 1000) % 60);
      const pctElapsed = Math.min(100, Math.max(8, Math.round(((totalWindow - diff) / totalWindow) * 100)));
      return {
        text: `${days > 0 ? days + 'd ' : ''}${String(hours).padStart(2,'0')}h ${String(mins).padStart(2,'0')}m ${String(secs).padStart(2,'0')}s`,
        urgent: days < 2,
        expired: false,
        pctElapsed
      };
    }

    function inferRejectedAfterStage(prevStage, existingRejectedAfter) {
      if (existingRejectedAfter) return existingRejectedAfter;
      if (prevStage === "Stage 3 - Assessment Centre") return "Stage 3 - Assessment Centre";
      if (prevStage === "Stage 2 - Video Interview") return "Stage 2 - Video Interview";
      if (prevStage === "Stage 1 - Online Assessment" || prevStage === "Action Required" || prevStage === "On Hold / Waitlist") {
        return "Stage 1 - Online Assessment";
      }
      return "CV / Application Screen";
    }

                  <div>
                    <label className="block text-slate-400 mb-1">Company *</label>
                    <input required type="text" value={newApp.company} onChange={e => setNewApp({ ...newApp, company: e.target.value })} className="w-full bg-[#06080F] border border-white/[0.1] rounded-xl px-3 py-2 text-white" />
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1">Sector</label>
                    <input type="text" value={newApp.sector} onChange={e => setNewApp({ ...newApp, sector: e.target.value })} className="w-full bg-[#06080F] border border-white/[0.1] rounded-xl px-3 py-2 text-white" />
                  </div>
                </div>

                <div className="text-xs">
                  <label className="block text-slate-400 mb-1">Role Title *</label>
                  <input required type="text" value={newApp.role} onChange={e => setNewApp({ ...newApp, role: e.target.value })} className="w-full bg-[#06080F] border border-white/[0.1] rounded-xl px-3 py-2 text-white" />
                </div>

                <div className="grid grid-cols-2 gap-3 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1">Stage</label>
                    <select value={newApp.stage} onChange={e => setNewApp({ ...newApp, stage: e.target.value })} className="w-full bg-[#06080F] border border-white/[0.1] rounded-xl px-2.5 py-2 text-white">
                      {STAGES.map(s => <option key={s.id} value={s.id}>{s.label}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1">Deadline (Optional)</label>
                    <input type="datetime-local" value={newApp.deadline} onChange={e => setNewApp({ ...newApp, deadline: e.target.value })} className="w-full bg-[#06080F] border border-white/[0.1] rounded-xl px-2.5 py-2 text-white font-mono-num" />
                  </div>
                </div>

                {newApp.stage === "Closed / Unsuccessful" && (
                  <div className="text-xs">
                    <label className="block text-rose-300 font-semibold mb-1">Unsuccessful After Which Stage?</label>
                    <select
                      value={newApp.rejectedAfterStage || "CV / Application Screen"}
                      onChange={e => setNewApp({ ...newApp, rejectedAfterStage: e.target.value })}
                      className="w-full bg-[#06080F] border border-rose-500/30 rounded-xl px-2.5 py-2 text-white"
                    >
                      {REJECTION_STAGES.map(r => (
                        <option key={r.id} value={r.id}>{r.label}</option>
                      ))}
                    </select>
                  </div>
                )}

                <div className="text-xs">
                  <label className="block text-slate-400 mb-1">Portal / Assessment Link</label>
                  <input type="url" value={newApp.portalLink} onChange={e => setNewApp({ ...newApp, portalLink: e.target.value })} placeholder="https://..." className="w-full bg-[#06080F] border border-white/[0.1] rounded-xl px-3 py-2 text-white" />
                </div>

                <div className="text-xs">
                  <label className="block text-slate-400 mb-1">Notes</label>
                  <textarea rows={2} value={newApp.notes} onChange={e => setNewApp({ ...newApp, notes: e.target.value })} className="w-full bg-[#06080F] border border-white/[0.1] rounded-xl px-3 py-2 text-white" />
                </div>

                <div className="flex justify-end gap-2 pt-2">
                  <button type="button" onClick={() => setShowAddModal(false)} className="px-3.5 py-2 rounded-xl text-xs text-slate-400">Cancel</button>
                  <button type="submit" className="px-4 py-2 rounded-xl text-xs font-bold bg-emerald-500 text-slate-950">Add to Tracker</button>
                </div>
              </form>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
