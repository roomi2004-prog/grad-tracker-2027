    /* "hell nahhh" Easter Egg Twerking Character Animations */
    @keyframes twerk-pop {
      0%, 100% { transform: translate(0px, 0px) rotate(-14deg) scaleY(1); }
      25% { transform: translate(-8px, -11px) rotate(12deg) scaleY(0.92); }
      50% { transform: translate(2px, 4px) rotate(-18deg) scaleY(1.06); }
      75% { transform: translate(-9px, -12px) rotate(16deg) scaleY(0.9); }
    }
    @keyframes twerk-torso {
      0%, 100% { transform: translateY(0px) rotate(-4deg); }
      50% { transform: translateY(-6px) rotate(5deg); }
    }
    @keyframes twerk-head {
      0%, 100% { transform: rotate(-6deg) translateY(0px); }
      50% { transform: rotate(8deg) translateY(-4px); }
    }
    @keyframes twerk-shadow {
      0%, 100% { transform: scaleX(1); opacity: 0.45; }
      50% { transform: scaleX(1.22); opacity: 0.25; }
    }
    @keyframes twerk-shockwave {
      0% { transform: scale(0.5); opacity: 0.85; }
      100% { transform: scale(1.7); opacity: 0; }
    }
    @keyframes guy-groove {
      0%, 100% { transform: translateY(0px) rotate(-2deg); }
      50% { transform: translateY(-5px) rotate(3deg); }
    }
    @keyframes hair-swish {
      0%, 100% { transform: rotate(-8deg); }
      50% { transform: rotate(14deg); }
    }
    .twerk-hips { transform-origin: 152px 134px; animation: twerk-pop 0.34s cubic-bezier(0.36, 0.07, 0.19, 0.97) infinite; }
    .twerk-torso { transform-origin: 152px 112px; animation: twerk-torso 0.34s ease-in-out infinite; }
    .twerk-head { transform-origin: 178px 68px; animation: twerk-head 0.34s ease-in-out infinite; }
    .twerk-hair { transform-origin: 186px 56px; animation: hair-swish 0.34s ease-in-out infinite; }
    .guy-groove { transform-origin: 84px 160px; animation: guy-groove 0.34s ease-in-out infinite; }
    .twerk-shadow { transform-origin: 130px 198px; animation: twerk-shadow 0.34s ease-in-out infinite; }
    .twerk-wave { transform-origin: 118px 134px; animation: twerk-shockwave 0.68s ease-out infinite; }
    @keyframes trophy-float {
      0%, 100% { transform: translateY(0px) rotate(-1.5deg) scale(1); }
      50% { transform: translateY(-7px) rotate(1.5deg) scale(1.04); }
    }
    @keyframes trophy-glow {
      0%, 100% { opacity: 0.55; transform: scale(0.95); }
      50% { opacity: 0.95; transform: scale(1.1); }
    }
    @keyframes trophy-sparkle {
      0%, 100% { opacity: 0.3; transform: scale(0.7) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.25) rotate(22deg); }
    }
    .trophy-float { transform-origin: 70px 72px; animation: trophy-float 2.2s ease-in-out infinite; }
    .trophy-glow { transform-origin: 70px 66px; animation: trophy-glow 1.8s ease-in-out infinite; }
    .trophy-sparkle { animation: trophy-sparkle 1.4s ease-in-out infinite; }

    body {
      background-color: var(--bg-canvas, #0A0A0A);
      background-image:
        radial-gradient(ellipse 80% 50% at 18% -10%, var(--spotlight-1, rgba(212, 175, 55, 0.11)), transparent 60%),
        radial-gradient(ellipse 70% 45% at 82% -12%, var(--spotlight-2, rgba(212, 175, 55, 0.05)), transparent 60%);
      background-attachment: fixed;
      color: var(--text-primary, #FAFAFA);
      font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    .font-mono-num {
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-variant-numeric: tabular-nums;
    }
    .theme-header {
      background-color: var(--bg-header);
      border-bottom: 1px solid var(--border-color);
    }
    .glass-surface {
      background-color: var(--bg-surface);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-color);
      box-shadow: var(--card-shadow);
      transition: background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .glass-card {
      background-color: var(--bg-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      box-shadow: var(--card-shadow);
      transition: transform 0.16s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.16s ease, box-shadow 0.16s ease, background-color 0.16s ease;
    }
    .glass-card:hover {
      transform: translateY(-2px);
      border-color: var(--border-hover);
      background-color: var(--bg-card-hover);
      box-shadow: var(--card-shadow-hover);
    }
    .offer-column-glow {
      border-color: rgba(163, 230, 53, 0.35) !important;
      background-image: linear-gradient(180deg, rgba(132, 204, 22, 0.07) 0%, transparent 45%);
    }
    .rec-section-glow {
      border-color: rgba(56, 189, 248, 0.28) !important;
      background-image: linear-gradient(135deg, rgba(56, 189, 248, 0.05) 0%, rgba(16, 185, 129, 0.04) 50%, transparent 100%);
    }
    .theme-input {
      background-color: var(--bg-input) !important;
      border: 1px solid var(--border-color) !important;
      color: var(--text-primary) !important;
    }
    .theme-input:focus {
      border-color: var(--accent-color) !important;
      outline: none;
    }
    .theme-accent-btn {
      background-color: var(--accent-color) !important;
      color: var(--accent-fg) !important;
      border: 1px solid var(--accent-border) !important;
    }
    .theme-accent-btn:hover {
      background-color: var(--accent-hover) !important;
    }
    .theme-accent-text {
      color: var(--accent-color) !important;
    }

      }));

    function getFirmDomain(firmName) {
      if (!firmName) return null;
      const raw = String(firmName).toLowerCase().trim();
      const withoutParens = raw.replace(/\(.*?\)/g, " ").replace(/\?/g, "").replace(/\s+/g, " ").trim();
      if (FIRM_DOMAIN_MAP[raw]) return FIRM_DOMAIN_MAP[raw];
      if (FIRM_DOMAIN_MAP[withoutParens]) return FIRM_DOMAIN_MAP[withoutParens];
      for (const entry of FIRM_DOMAIN_MATCHERS) {
        if (entry.re.test(withoutParens) || entry.re.test(raw)) {
          return entry.domain;
        }
      }
      // Smart fallback: strip legal/region suffixes, spaces & punctuation, append .com
      const stem = withoutParens
        .replace(/\b(limited|ltd|plc|llp|inc|corp|corporation|holdings?|group|uk|london|international)\b/g, " ")
        .replace(/[^a-z0-9]/g, "")
        .trim();
      if (stem.length >= 2) return `${stem}.com`;
      return null;
    }

    const GlassDropdown = ({ value, options, onChange, ariaLabel, title, align = "left", minWidth = "min-w-[220px]", highlightWhenActive = false }) => {
      const [open, setOpen] = useState(false);
      const wrapRef = React.useRef(null);

      useEffect(() => {
        if (!open) return;
        const onOutside = (e) => {
          if (wrapRef.current && !wrapRef.current.contains(e.target)) {
            setOpen(false);
          }
        };
        const onKey = (e) => {
          if (e.key === "Escape") setOpen(false);
        };
        document.addEventListener("mousedown", onOutside);
        document.addEventListener("touchstart", onOutside, { passive: true });
        document.addEventListener("keydown", onKey);
        return () => {
          document.removeEventListener("mousedown", onOutside);
          document.removeEventListener("touchstart", onOutside);
          document.removeEventListener("keydown", onKey);
        };
      }, [open]);

    function utf8ToBase64(str) {
      const bytes = new TextEncoder().encode(str);
      let binary = "";
      const chunkSize = 0x8000;
      for (let i = 0; i < bytes.length; i += chunkSize) {
        binary += String.fromCharCode(...bytes.subarray(i, i + chunkSize));
      }
      return btoa(binary);
    }

    function base64ToUtf8(b64) {
      const clean = String(b64 || "").replace(/\s+/g, "");
      const binary = atob(clean);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return new TextDecoder("utf-8").decode(bytes);
    }

    // RFC 5545 iCalendar generator (mirrors scripts/daily-trackr.mjs & generate_ics.py)
    function icsEscape(text) {
      if (!text) return "";
      return String(text)
        .replace(/\\/g, "\\\\")
        .replace(/;/g, "\\;")
        .replace(/,/g, "\\,")
        .replace(/\r\n|\n|\r/g, "\\n");
    }

    function foldIcsLine(line) {
      const enc = new TextEncoder();
      if (enc.encode(line).length <= 75) return line;
      const parts = [];
      let cur = "";
      let curBytes = 0;
      for (const ch of line) {
        const len = enc.encode(ch).length;
        if (curBytes + len > 75) {
          parts.push(cur);
          cur = " " + ch;
          curBytes = 1 + len;
        } else {
          cur += ch;
          curBytes += len;
        }
      }
      if (cur) parts.push(cur);
      return parts.join("\r\n");
    }

    function formatIcsLocalDate(dt) {
      const p = (n) => String(n).padStart(2, "0");
      return `${dt.getFullYear()}${p(dt.getMonth() + 1)}${p(dt.getDate())}T${p(dt.getHours())}${p(dt.getMinutes())}${p(dt.getSeconds())}`;
    }

    function generateIcsFromState(applications, recommendations, handledRecIds, recsPaused) {

      const dtstamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d{3}Z$/, "Z");

      const lines = [

          ? "INTERVIEW"

        const desc = [

          `Role: ${app.role}`,

          `Stage: ${app.stage || ""}`,
          `Status: ${sub}`,
          app.portalLink ? `Portal Link: ${app.portalLink}` : "",
          app.notes ? `Notes: ${app.notes}` : ""
        ].filter(Boolean).join("\n");

        lines.push(
          "BEGIN:VEVENT",
          `UID:app-deadline-${app.id}@grad-tracker-2027.github.io`,
          `DTSTAMP:${dtstamp}`,
          `DTSTART;TZID=Europe/London:${formatIcsLocalDate(startDt)}`,
          `DTEND;TZID=Europe/London:${formatIcsLocalDate(endDt)}`,
          `SUMMARY:${icsEscape(summary)}`,
          `DESCRIPTION:${icsEscape(desc)}`,
          "STATUS:CONFIRMED"
        );
        if (app.portalLink && String(app.portalLink).startsWith("http")) {
          lines.push(`URL:${app.portalLink}`);
        }
        pushValarms(summary);
        lines.push("END:VEVENT");

      for (const rec of recsList) {
        const slug = makeRecSlug(rec.company, rec.role);
        if (handledSet.has(rec.id) || handledSet.has(slug) || appSlugs.has(slug)) continue;
        const closing = String(rec.closingDate || "").trim();
        const m = closing.match(/^(\d{4})-(\d{2})-(\d{2})$/);
        if (!m) continue;
        const endDt = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]), 17, 0, 0);
        const startDt = new Date(endDt.getTime() - 3600000);
        const summary = `CLOSING DATE: ${rec.company} — ${rec.role}`;
        const desc = [
          `Recommended Role (${rec.sourceDetail || rec.source || "Trackr"})`,

          `Role: ${rec.role}`,
          `Sector: ${rec.sector || ""}`,

          `Closing Date: ${closing}`,
          rec.applyLink ? `Apply Link: ${rec.applyLink}` : "",
          rec.notes ? `Notes: ${rec.notes}` : ""

        lines.push(
          "BEGIN:VEVENT",
          `UID:rec-closing-${rec.id}@grad-tracker-2027.github.io`,
          `DTSTAMP:${dtstamp}`,
          `DTSTART;TZID=Europe/London:${formatIcsLocalDate(startDt)}`,

        lines.push("END:VEVENT");
      }

      lines.push("END:VCALENDAR");
      return lines.map(foldIcsLine).join("\r\n") + "\r\n";

    async function githubGetFile(token, cfg, filePath) {
      const headers = {
        Accept: "application/vnd.github+json",
        "X-GitHub-Api-Version": "2022-11-28"
      };
      if (token) headers.Authorization = `Bearer ${token}`;
      const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${filePath}?ref=${encodeURIComponent(cfg.branch)}&t=${Date.now()}`;
      const res = await fetch(url, { headers, cache: "no-store" });
      if (res.status === 404) return null;
      if (!res.ok) {
        const errBody = await res.text().catch(() => "");
        throw new Error(`GitHub GET ${filePath} failed (${res.status}): ${errBody.slice(0, 140)}`);
      }
      return await res.json();
    }

    async function githubPutFile(token, cfg, filePath, contentUtf8, commitMessage, attempt = 1) {
      const existing = await githubGetFile(token, cfg, filePath);
      const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${filePath}`;
      const body = {
        message: commitMessage,
        content: utf8ToBase64(contentUtf8),
        branch: cfg.branch
      };
      if (existing && existing.sha) body.sha = existing.sha;

      const res = await fetch(url, {
        method: "PUT",
        headers: {
          Authorization: `Bearer ${token}`,
          Accept: "application/vnd.github+json",
          "Content-Type": "application/json",
          "X-GitHub-Api-Version": "2022-11-28"
        },
        body: JSON.stringify(body)
      });

      if (res.status === 409 && attempt < 3) {
        return githubPutFile(token, cfg, filePath, contentUtf8, commitMessage, attempt + 1);
      }
      if (!res.ok) {
        const errBody = await res.text().catch(() => "");
        throw new Error(`GitHub PUT ${filePath} failed (${res.status}): ${errBody.slice(0, 160)}`);
      }
      return await res.json();
    }

    async function fetchRemoteMasterState(token, cfg) {
      // If a Cloud Sync Token is set, read state.json directly from GitHub Contents API for zero CDN delay
      if (token) {
        try {
          const apiFile = await githubGetFile(token, cfg, "state.json");
          if (apiFile && apiFile.content) {
            return { state: JSON.parse(base64ToUtf8(apiFile.content)), source: "github-api" };
          }
        } catch {}
      }
      // Fallback to hosted ./state.json on GitHub Pages / local server
      const res = await fetch(`./state.json?t=${Date.now()}`, { cache: "no-store" });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return { state: await res.json(), source: "state-json" };
    }

    function sanitizeAndDedupeApps(list, deletedIds = []) {
      const deletedSet = new Set((deletedIds || []).map(String));
      const normalized = (Array.isArray(list) ? list : [])
        .map(normalizeApp)
        .filter(Boolean)
        .map(a => a.stage === "Closed / Unsuccessful" ? { ...a, deadline: null } : a);

      // Collect canonical firm keys of all real (non-synthetic) tracker entries scoped by category
      const realFirmKeys = new Set();
      const realPartTimeRoleKeys = new Set();
      const realApps = [];
      for (const a of normalized) {
        if (deletedSet.has(String(a.id))) continue;
        if (!isSyntheticGmailCard(a)) {
          realApps.push(a);
          const fk = canonicalFirmKey(a.company);
          const cat = a.category || "internship";
          if (fk) {
            if (cat === "parttime") {
              realPartTimeRoleKeys.add(`${fk}::${String(a.role || "").toLowerCase().trim()}`);
            } else {
              realFirmKeys.add(`${cat}::${fk}`);
            }
          }
        }
      }

      // Merge recruitment-vendor emails (e.g. Groupgti) into the real employer card (e.g. Sky):
      // advance its pipeline stage + status automatically and drop the stray vendor card.
      const mergedVendorIds = new Set();
      for (const v of normalized) {
        if (!isSyntheticGmailCard(v) || deletedSet.has(String(v.id))) continue;
        const targetName = resolveVendorAlias(v);
        if (!targetName) continue;
        const targetKey = canonicalFirmKey(targetName);
        const idx = realApps.findIndex(r => canonicalFirmKey(r.company) === targetKey);
        if (idx < 0) continue;
        mergedVendorIds.add(String(v.id));
        const target = realApps[idx];
        const vRank = PIPELINE_STAGE_RANK[v.stage] || 0;
        const tRank = PIPELINE_STAGE_RANK[target.stage] || 0;
        if (vRank > tRank) {
          const stamp = String(v.appliedDate || localTodayStr()).slice(0, 10);
          const nextSub = String(v.subStatus || "").trim();
          realApps[idx] = {
            ...target,
            stage: v.stage,
            subStatus: nextSub ? `${v.stage === "Stage 2 - Video Interview" ? "Stage 2: " : ""}${nextSub}` : target.subStatus,
            deadline: v.deadline || null,
            calendarSynced: false,
            notes: `${target.notes ? `${target.notes} ` : ""}[${stamp}] Moved to ${v.stage} (auto-detected from Gmail; stage before assumed completed).`.trim(),
            _gmailSubStatus: nextSub || target._gmailSubStatus,
            _gmailDeadline: v.deadline || null
          };
        }
      }

      // Only keep synthetic Gmail cards that are real firms, not deleted, and not duplicates of existing/closed firms in the same category
      const seenSynthKeys = new Set();
      const keptSynth = [];
      for (const a of normalized) {
        if (!isSyntheticGmailCard(a)) continue;
        if (deletedSet.has(String(a.id))) continue;
        if (mergedVendorIds.has(String(a.id))) continue;
        if (isJunkEmailCard(a)) continue;
        const fk = canonicalFirmKey(a.company);
        if (!fk) continue;
        const cat = a.category || "internship";
        if (cat === "parttime") {
          const ptKey = `${fk}::${String(a.role || "").toLowerCase().trim()}`;
          if (realPartTimeRoleKeys.has(ptKey) || seenSynthKeys.has(ptKey)) continue;
          seenSynthKeys.add(ptKey);
          keptSynth.push(a);
          continue;
        }
        const scopedKey = `${cat}::${fk}`;
        if (realFirmKeys.has(scopedKey) || seenSynthKeys.has(scopedKey)) continue;
        // Also catch concatenated names like "fidelityinternational" matching "fidelity" within the same category
        let overlapsExisting = false;
        for (const existingScoped of realFirmKeys) {
          if (!existingScoped.startsWith(`${cat}::`)) continue;

            overlapsExisting = true;
            break;
          }
        }

    function normalizeStage(rawStage) {
      const valid = new Set(STAGES.map(st => st.id));
      if (valid.has(rawStage)) return rawStage;
      const t = String(rawStage || "").toLowerCase();
      if (t.includes("offer") || t.includes("success")) return "Offer / Successful";
      if (t.includes("closed") || t.includes("reject") || t.includes("unsuccess")) return "Closed / Unsuccessful";
      if (t.includes("hold") || t.includes("waitlist")) return "On Hold / Waitlist";
      if (t.includes("assessment centre") || t.includes("superday") || t.includes("stage 3") || t.includes(" ac")) return "Stage 3 - Assessment Centre";

    // Smart merge: preserves user's manual edits (notes, stage, custom fields) for existing IDs

    function smartMergeApps(initialApps, savedApps) {
      if (!Array.isArray(savedApps) || savedApps.length === 0) {
        return initialApps.map(item => ({
          ...item,
          _gmailSubStatus: item.subStatus,
          _gmailDeadline: item.deadline
        }));
      }

      const validStageIds = new Set(STAGES.map(st => st.id));
      const merged = [];
      const seenIds = new Set();

      for (const savedItem of savedApps) {
        if (!savedItem || savedItem.id === undefined) continue;
        seenIds.add(savedItem.id);

        const initItem = initialApps.find(i => i.id === savedItem.id);
        if (!initItem) {
          const stage = validStageIds.has(savedItem.stage) ? savedItem.stage : "Application Submitted";
          merged.push({ ...savedItem, stage });
          continue;
        }

        const baselineSubStatus = savedItem._gmailSubStatus !== undefined ? savedItem._gmailSubStatus : initItem.subStatus;
        const baselineDeadline = savedItem._gmailDeadline !== undefined ? savedItem._gmailDeadline : initItem.deadline;

        const hasNewerGmailSubStatus = initItem.subStatus !== baselineSubStatus;
        const hasNewerGmailDeadline = initItem.deadline !== baselineDeadline;
        const hasNewerGmailUpdate = hasNewerGmailSubStatus || hasNewerGmailDeadline;

        const preservedStage = validStageIds.has(savedItem.stage) ? savedItem.stage : initItem.stage;
        const preservedNotes = (savedItem.notes !== undefined && savedItem.notes !== "")
          ? savedItem.notes
          : initItem.notes;

        merged.push({
          ...initItem,
          ...savedItem,
          stage: hasNewerGmailUpdate ? initItem.stage : preservedStage,
          rejectedAfterStage: hasNewerGmailUpdate
            ? (initItem.rejectedAfterStage || savedItem.rejectedAfterStage || null)
            : (savedItem.rejectedAfterStage || initItem.rejectedAfterStage || null),
          subStatus: hasNewerGmailSubStatus ? initItem.subStatus : (savedItem.subStatus ?? initItem.subStatus),
          deadline: hasNewerGmailDeadline ? initItem.deadline : (savedItem.deadline !== undefined ? savedItem.deadline : initItem.deadline),
          notes: preservedNotes,
          calendarSynced: hasNewerGmailDeadline ? initItem.calendarSynced : (savedItem.calendarSynced ?? initItem.calendarSynced),
          _gmailSubStatus: initItem.subStatus,
          _gmailDeadline: initItem.deadline
        });
      }

      for (const initItem of initialApps) {
        if (!seenIds.has(initItem.id)) {
          merged.push({
            ...initItem,
            _gmailSubStatus: initItem.subStatus,
            _gmailDeadline: initItem.deadline
          });
        }

    function formatCountdown(deadlineStr, appliedDateStr, now) {
      if (!deadlineStr) return null;
      const targetMs = new Date(deadlineStr).getTime();
      const startMs = appliedDateStr ? new Date(appliedDateStr + "T09:00:00").getTime() : targetMs - 5 * 86400000;
      const totalWindow = Math.max(targetMs - startMs, 3600000);
      const diff = targetMs - now;
      if (diff <= 0) {
        return { text: "WINDOW EXPIRED / CHECK PORTAL", urgent: true, expired: true, pctRemaining: 100 };
      }
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const mins = Math.floor((diff / (1000 * 60)) % 60);
      const secs = Math.floor((diff / 1000) % 60);
      const pctElapsed = Math.min(100, Math.max(8, Math.round(((totalWindow - diff) / totalWindow) * 100)));
      return {
        text: `${days > 0 ? days + 'd ' : ''}${String(hours).padStart(2,'0')}h ${String(mins).padStart(2,'0')}m ${String(secs).padStart(2,'0')}s`,
        urgent: days < 2,
        expired: false,
        pctElapsed
      };
    }

    function createBarbieSynth() {
      let ctx = null;
      let masterGain = null;
      let timerId = null;
      let stepIdx = 0;
      let isPlaying = false;
      let isMuted = false;

      const ensureCtx = () => {
        if (!ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return null;
          ctx = new AudioCtx();
          masterGain = ctx.createGain();
          masterGain.gain.value = isMuted ? 0 : 0.85;
          masterGain.connect(ctx.destination);
        }
        if (ctx.state === "suspended") {
          ctx.resume().catch(() => {});
        }
        return ctx;
      };

      const playTone = (freq, startTime, duration, type, peakGain) => {
        if (!ctx || !masterGain || !freq) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, startTime);
        gain.gain.setValueAtTime(0.0001, startTime);
        gain.gain.exponentialRampToValueAtTime(peakGain, startTime + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
        osc.connect(gain);
        gain.connect(masterGain);
        osc.start(startTime);
        osc.stop(startTime + duration + 0.02);
      };

      const tick = () => {
        if (!isPlaying || !ctx) return;
        const stepSec = 0.23; // ~130 BPM eighth notes
        const step = BARBIE_PATTERN[stepIdx % BARBIE_PATTERN.length];
        const t = ctx.currentTime + 0.02;
        if (step.lead) {
          playTone(step.lead, t, stepSec * (step.dur || 0.9), "triangle", 0.11);
          playTone(step.lead * 2, t, stepSec * 0.45, "sine", 0.028);
        }
        if (step.bass) {
          playTone(step.bass, t, stepSec * 1.15, "sawtooth", 0.045);
        }
        stepIdx = (stepIdx + 1) % BARBIE_PATTERN.length;
      };

      return {
        start() {
          const c = ensureCtx();
          if (!c) return false;
          if (isPlaying) return true;
          isPlaying = true;
          stepIdx = 0;
          tick();
          timerId = setInterval(tick, 230);
          return true;

        stop() {
          isPlaying = false;
          if (timerId) {
            clearInterval(timerId);
            timerId = null;
          }

          if (masterGain && ctx) {
            masterGain.gain.setTargetAtTime(isMuted ? 0 : 0.85, ctx.currentTime, 0.02);

        isPlaying() {
          return isPlaying;

    function createVivaLaVidaSynth() {
      let ctx = null;
      let masterGain = null;
      let dryBus = null;
      let reverbSend = null;
      let timerId = null;
      let stepIdx = 0;
      let isPlaying = false;
      let isMuted = false;

      const buildConcertReverb = (audioCtx) => {
        const rate = audioCtx.sampleRate;
        const length = Math.floor(rate * 1.9);
        const impulse = audioCtx.createBuffer(2, length, rate);
        for (let ch = 0; ch < 2; ch++) {
          const data = impulse.getChannelData(ch);
          for (let i = 0; i < length; i++) {
            const decay = Math.pow(1 - i / length, 2.6);
            data[i] = (Math.random() * 2 - 1) * decay * 0.45;
          }
        }
        const conv = audioCtx.createConvolver();
        conv.buffer = impulse;
        return conv;
      };

      const ensureCtx = () => {
        if (!ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return null;
          ctx = new AudioCtx();
          masterGain = ctx.createGain();
          masterGain.gain.value = isMuted ? 0 : 0.95;
          masterGain.connect(ctx.destination);

          dryBus = ctx.createGain();
          dryBus.gain.value = 0.78;
          dryBus.connect(masterGain);

          const reverb = buildConcertReverb(ctx);
          reverbSend = ctx.createGain();
          reverbSend.gain.value = 0.42;
          reverbSend.connect(reverb);
          reverb.connect(masterGain);
        }
        if (ctx.state === "suspended") {
          ctx.resume().catch(() => {});
        }
        return ctx;
      };

      // Warm detuned orchestral string voice (bowed filter sweep + stereo ensemble detune)
      const playOrchestralString = (freq, startTime, duration, peakGain) => {
        if (!ctx || !freq) return;
        const filter = ctx.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.setValueAtTime(620, startTime);
        filter.frequency.exponentialRampToValueAtTime(1750, startTime + Math.min(0.06, duration * 0.35));
        filter.frequency.exponentialRampToValueAtTime(1050, startTime + duration);
        filter.Q.value = 0.9;

        const env = ctx.createGain();
        env.gain.setValueAtTime(0.0001, startTime);
        env.gain.exponentialRampToValueAtTime(peakGain, startTime + 0.028);
        env.gain.setValueAtTime(peakGain * 0.85, startTime + Math.max(0.035, duration * 0.72));
        env.gain.exponentialRampToValueAtTime(0.0001, startTime + duration + 0.05);

        filter.connect(env);
        env.connect(dryBus);
        env.connect(reverbSend);

        for (const detuneCents of [-7, 7]) {
          const osc = ctx.createOscillator();
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(freq, startTime);
          osc.detune.setValueAtTime(detuneCents, startTime);
          osc.connect(filter);
          osc.start(startTime);
          osc.stop(startTime + duration + 0.06);
        }
      };

      // Soaring violin / vocal lead voice
      const playLeadVoice = (freq, startTime, duration, peakGain) => {
        if (!ctx || !freq) return;
        const filter = ctx.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.setValueAtTime(2400, startTime);

        const env = ctx.createGain();
        env.gain.setValueAtTime(0.0001, startTime);
        env.gain.exponentialRampToValueAtTime(peakGain, startTime + 0.03);
        env.gain.exponentialRampToValueAtTime(0.0001, startTime + duration + 0.06);

        filter.connect(env);
        env.connect(dryBus);
        env.connect(reverbSend);

        const osc1 = ctx.createOscillator();
        osc1.type = "triangle";
        osc1.frequency.setValueAtTime(freq, startTime);
        osc1.connect(filter);
        osc1.start(startTime);
        osc1.stop(startTime + duration + 0.08);

        const osc2 = ctx.createOscillator();
        osc2.type = "sawtooth";
        osc2.frequency.setValueAtTime(freq * 2, startTime);
        const hiGain = ctx.createGain();
        hiGain.gain.value = 0.18;
        osc2.connect(hiGain);
        hiGain.connect(filter);
        osc2.start(startTime);
        osc2.stop(startTime + duration + 0.08);
      };

      // Deep booming concert bass drum / timpani pulse
      const playConcertKick = (startTime) => {
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const env = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(98, startTime);
        osc.frequency.exponentialRampToValueAtTime(42, startTime + 0.14);
        env.gain.setValueAtTime(0.24, startTime);
        env.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.28);
        osc.connect(env);
        env.connect(dryBus);
        env.connect(reverbSend);
        osc.start(startTime);
        osc.stop(startTime + 0.3);
      };

      // Jerusalem tubular church bell chime
      const playChurchBell = (freq, startTime) => {
        if (!ctx || !freq) return;
        for (const [ratio, gainVal, decay] of [[1, 0.048, 1.35], [2.76, 0.022, 0.85], [5.4, 0.01, 0.45]]) {
          const osc = ctx.createOscillator();
          const g = ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(freq * ratio, startTime);
          g.gain.setValueAtTime(0.0001, startTime);
          g.gain.exponentialRampToValueAtTime(gainVal, startTime + 0.008);
          g.gain.exponentialRampToValueAtTime(0.0001, startTime + decay);
          osc.connect(g);
          g.connect(reverbSend);
          g.connect(dryBus);
          osc.start(startTime);
          osc.stop(startTime + decay + 0.05);
        }
      };

      const tick = () => {
        if (!isPlaying || !ctx) return;
        const stepSec = 0.217; // 138 BPM eighth-note pulse
        const barStep = stepIdx % 32;
        const phraseIdx = Math.floor(stepIdx / 32) % 3; // 0 = Intro Strings, 1 = Chorus Melody, 2 = Stadium Chant
        const ost = VIVA_OSTINATO[barStep];
        const t = ctx.currentTime + 0.02;

        // 1. Signature syncopated orchestral string chords
        if (ost.chord && VIVA_CHORDS[ost.chord]) {
          const chordGain = ost.accent ? 0.036 : 0.026;
          for (const f of VIVA_CHORDS[ost.chord]) {
            playOrchestralString(f, t, stepSec * ost.dur, chordGain);
          }
        }

        // 2. Booming 4-on-the-floor concert bass drum
        if (ost.kick) {
          playConcertKick(t);
        }

        // 3. Deep cello / contrabass pedal
        if (ost.bass) {
          playOrchestralString(ost.bass, t, stepSec * 3.6, 0.048);
        }

        // 4. Shimmering Jerusalem church bells (phrases 1 & 2)
        if (ost.bell && phraseIdx >= 1) {
          playChurchBell(ost.bell, t);
        }

        // 5. Soaring chorus melody (Phrase 1) or Stadium "Oh-oh-oh" chant (Phrase 2)
        if (phraseIdx === 1) {
          const m = VIVA_CHORUS_MELODY[barStep];
          if (m) playLeadVoice(m.f * 2, t, stepSec * m.d, 0.085);
        } else if (phraseIdx === 2) {
          const c = VIVA_CHANT_MELODY[barStep];
          if (c) playLeadVoice(c.f, t, stepSec * c.d, 0.095);
        }

        stepIdx = (stepIdx + 1) % 96; // 12-bar full orchestral cycle
      };

      return {
        start() {
          const c = ensureCtx();
          if (!c) return false;
          if (isPlaying) return true;
          isPlaying = true;
          stepIdx = 0;
          tick();
          timerId = setInterval(tick, 217);
          return true;
        },
        stop() {
          isPlaying = false;
          if (timerId) {
            clearInterval(timerId);
            timerId = null;
          }
        },
        setMuted(muted) {
          isMuted = Boolean(muted);
          if (masterGain && ctx) {
            masterGain.gain.setTargetAtTime(isMuted ? 0 : 0.95, ctx.currentTime, 0.02);
          }
        },
        isPlaying() {
          return isPlaying;
        }
      };
    }

    // 100% Offline Bouncy 808 Beat Synth for "hell nahhh" Twerking Easter Egg
    function createTwerkBeatSynth() {
      let ctx = null;
      let masterGain = null;
      let timerId = null;
      let stepIdx = 0;
      let isPlaying = false;
      let isMuted = false;

      const ensureCtx = () => {
        if (!ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return null;
          ctx = new AudioCtx();
          masterGain = ctx.createGain();
          masterGain.gain.value = isMuted ? 0 : 0.85;
          masterGain.connect(ctx.destination);
        }
        if (ctx.state === "suspended") ctx.resume().catch(() => {});
        return ctx;
      };

      const kick = (t) => {
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(145, t);
        osc.frequency.exponentialRampToValueAtTime(42, t + 0.13);
        g.gain.setValueAtTime(0.28, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
        osc.connect(g);
        g.connect(masterGain);
        osc.start(t);
        osc.stop(t + 0.23);
      };

      const clap = (t) => {
        const bufSize = Math.floor(ctx.sampleRate * 0.08);
        const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufSize * 0.25));
        const src = ctx.createBufferSource();
        src.buffer = buf;
        const hp = ctx.createBiquadFilter();
        hp.type = "bandpass";
        hp.frequency.value = 1400;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.16, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
        src.connect(hp);
        hp.connect(g);
        g.connect(masterGain);
        src.start(t);
      };

      const hat = (t) => {
        const bufSize = Math.floor(ctx.sampleRate * 0.03);
        const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufSize * 0.2));
        const src = ctx.createBufferSource();
        src.buffer = buf;
        const hp = ctx.createBiquadFilter();
        hp.type = "highpass";
        hp.frequency.value = 6500;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.06, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.03);
        src.connect(hp);
        hp.connect(g);
        g.connect(masterGain);
        src.start(t);
      };

      // 8-step bouncy club beat (~175ms per 8th note)
      const KICK_STEPS = new Set([0, 3, 4, 6]);
      const CLAP_STEPS = new Set([2, 6]);

      const tick = () => {
        if (!isPlaying || !ctx) return;
        const s = stepIdx % 8;
        const t = ctx.currentTime + 0.015;
        if (KICK_STEPS.has(s)) kick(t);
        if (CLAP_STEPS.has(s)) clap(t);
        hat(t);
        stepIdx = (stepIdx + 1) % 8;
      };

      return {
        start() {
          const c = ensureCtx();
          if (!c) return false;
          if (isPlaying) return true;
          isPlaying = true;
          stepIdx = 0;
          tick();
          timerId = setInterval(tick, 170);
          return true;
        },
        stop() {
          isPlaying = false;
          if (timerId) {
            clearInterval(timerId);
            timerId = null;
          }
        },
        setMuted(muted) {
          isMuted = Boolean(muted);
          if (masterGain && ctx) {
            masterGain.gain.setTargetAtTime(isMuted ? 0 : 0.85, ctx.currentTime, 0.02);
          }
        },
        isPlaying() { return isPlaying; }
      };
    }

      const [now, setNow] = useState(Date.now());

      useEffect(() => {

      useEffect(() => {

      }, []);

      useEffect(() => {

      }, [rawApps]);

      useEffect(() => {
        try { localStorage.setItem(HANDLED_RECS_KEY, JSON.stringify(handledRecs)); } catch {}
      }, [handledRecs]);

      useEffect(() => {

      useEffect(() => {

      useEffect(() => {

      useEffect(() => {
        try { localStorage.setItem(DELETED_APPS_KEY, JSON.stringify(deletedAppIds)); } catch {}
      }, [deletedAppIds]);

      // Build unified master state snapshot and push state.json + deadlines.ics to GitHub if token is configured
      const pushSnapshotToCloud = (overrides = {}, commitMsg = "Mobile sync from Rags to Riches") => {
        const cur = latestStateRef.current;
        const nextApps = overrides.applications !== undefined ? overrides.applications : cur.apps;
        const nextRecs = overrides.recommendations !== undefined ? overrides.recommendations : cur.recs;
        const nextHandled = overrides.handledRecIds !== undefined ? overrides.handledRecIds : cur.handled;
        const nextShortlisted = overrides.shortlistedRecIds !== undefined ? overrides.shortlistedRecIds : cur.shortlisted;
        const nextSnoozed = overrides.snoozedRecs !== undefined ? overrides.snoozedRecs : cur.snoozed;
        const nextDeleted = overrides.deletedAppIds !== undefined ? overrides.deletedAppIds : cur.deletedIds;
        const nextArchive = overrides.cycleArchive !== undefined ? overrides.cycleArchive : cur.archive;
        const cleanApps = sanitizeAndDedupeApps(nextApps, nextDeleted);
        const nextOfferAccepted = Boolean(nextArchive && nextArchive.offerAccepted);
        const nextPaused = Boolean(nextArchive && (nextArchive.offerAccepted || nextArchive.archived || nextArchive.recommendationsPaused));
        const nowIso = new Date().toISOString();

        const masterPayload = {
          ...remoteExtrasRef.current,
          version: 6,
          updatedAt: nowIso,
          applications: cleanApps,
          recommendations: nextRecs,
          handledRecIds: nextHandled,
          dismissedIds: nextHandled,
          shortlistedRecIds: nextShortlisted,
          snoozedRecs: nextSnoozed,
          deletedAppIds: nextDeleted,
          cycleArchive: nextArchive || null,
          offerAccepted: nextOfferAccepted,
          recommendationsPaused: nextPaused
        };

        try {
          localStorage.setItem(LOCAL_UPDATED_AT_KEY, nowIso);
          localStorage.setItem(STORAGE_KEY, JSON.stringify(cleanApps));
          localStorage.setItem(CACHED_RECS_KEY, JSON.stringify(nextRecs));
          localStorage.setItem(HANDLED_RECS_KEY, JSON.stringify(nextHandled));
          localStorage.setItem(SHORTLISTED_RECS_KEY, JSON.stringify(nextShortlisted));
          localStorage.setItem(SNOOZED_RECS_KEY, JSON.stringify(nextSnoozed || {}));
          localStorage.setItem(DELETED_APPS_KEY, JSON.stringify(nextDeleted));
        } catch {}

        const activeToken = overrides._token !== undefined ? overrides._token : ghToken;
        const activeCfg = overrides._config !== undefined ? overrides._config : ghConfig;
        if (!activeToken) return;

        setCloudSyncStatus("syncing");
        setCloudSyncMsg("Syncing updates to cloud…");

        cloudQueueRef.current = cloudQueueRef.current.then(async () => {
          try {
            const stateJsonStr = JSON.stringify(masterPayload, null, 2) + "\n";
            await githubPutFile(activeToken, activeCfg, "state.json", stateJsonStr, commitMsg);
            const icsStr = generateIcsFromState(cleanApps, nextRecs, nextHandled, nextPaused);
            await githubPutFile(activeToken, activeCfg, "deadlines.ics", icsStr, `${commitMsg} (deadlines.ics)`);
            const tLabel = new Date().toLocaleTimeString("en-GB", { timeZone: "Europe/London" });
            setCloudSyncStatus("synced");
            setLastCloudSyncAt(tLabel);
            setCloudSyncMsg(`Synced to ${activeCfg.owner}/${activeCfg.repo} at ${tLabel}`);
          } catch (err) {
            setCloudSyncStatus("error");
            setCloudSyncMsg(err && err.message ? err.message : "Cloud push failed — saved locally.");
          }
        });
      };

      // Fetch state.json on load (merging cleanly with localStorage for offline support)
      const pullFromMasterState = async ({ forceRemote = false, silent = false } = {}) => {
        try {
          const { state: remote, source } = await fetchRemoteMasterState(ghToken, ghConfig);
          if (!remote || !Array.isArray(remote.applications)) return null;

          // Keep extra keys written by external sync jobs (e.g. processedEmailIds from Cloud Gmail Sync)
          const { version, updatedAt, applications, recommendations, handledRecIds, shortlistedRecIds: remoteShortlistedIds, snoozedRecs: remoteSnoozedRecs, deletedAppIds: remoteDeletedIds, cycleArchive: _ca, offerAccepted: _oa, recommendationsPaused: _rp, ...extraKeys } = remote;
          remoteExtrasRef.current = extraKeys;

          const mergedDeletedIds = Array.from(new Set([
            ...loadDeletedAppIds(),
            ...((Array.isArray(remoteDeletedIds) ? remoteDeletedIds : []).map(String))
          ]));
          setDeletedAppIds(mergedDeletedIds);

          const normalizedRemoteApps = sanitizeAndDedupeApps(remote.applications, mergedDeletedIds);
          const combinedRemoteRecs = [
            ...(Array.isArray(remote.recommendations) ? remote.recommendations : []),
            ...(Array.isArray(remote.recommended) ? remote.recommended : [])
          ].map(normalizeRec).filter(Boolean);

          const localUpdatedAt = localStorage.getItem(LOCAL_UPDATED_AT_KEY) || "";
          const remoteUpdatedAt = remote.updatedAt || "";
          const localAppsNow = loadMergedApps();
          const localArchiveNow = loadCycleArchive();
          const hasLocalData = localAppsNow.length > 0 || Boolean(localArchiveNow);
          const localIdSet = new Set(localAppsNow.map(a => String(a.id)));
          const remoteHasUnseenApps = normalizedRemoteApps.some(a => !localIdSet.has(String(a.id)));
          const remoteIsNewer = forceRemote || !hasLocalData || remoteHasUnseenApps || (remoteUpdatedAt && (!localUpdatedAt || remoteUpdatedAt > localUpdatedAt));

          // Merge 7-day archive (snooze) timestamps from cloud + this device, keeping the later expiry
          if (remoteSnoozedRecs && typeof remoteSnoozedRecs === "object" && !Array.isArray(remoteSnoozedRecs)) {
            setSnoozedRecs(mergeSnoozedMaps(loadSnoozedRecs(), remoteSnoozedRecs));
          }

          // Always union handledRecIds + dismissedIds so applied/dismissed roles never reappear
          const mergedHandled = Array.from(new Set([
            ...loadHandledRecs(),
            ...(remote.handledRecIds || []),
            ...(remote.dismissedIds || [])
          ]));
          setHandledRecs(mergedHandled);

          if (Array.isArray(remoteShortlistedIds) && remoteIsNewer) {
            setShortlistedRecs(remoteShortlistedIds);
          } else if (Array.isArray(remoteShortlistedIds) && loadShortlistedRecs().length === 0 && remoteShortlistedIds.length > 0) {
            setShortlistedRecs(remoteShortlistedIds);
          }

          if (combinedRemoteRecs.length > 0) {
            const seenRec = new Set();
            const dedupedRecs = combinedRemoteRecs.filter(r => {
              const key = makeRecSlug(r.company, r.role);
              if (seenRec.has(key)) return false;
              seenRec.add(key);
              return true;
            });
            setRawRecs(dedupedRecs);
          }

          if (remoteIsNewer) {
            if (remote.cycleArchive && (remote.cycleArchive.offerAccepted || remote.cycleArchive.archived)) {
              const archJson = JSON.stringify(remote.cycleArchive);
              try {
                localStorage.setItem(CYCLE_ARCHIVE_KEY, archJson);
                localStorage.setItem(CYCLE_ARCHIVE_HUMAN_KEY, archJson);
                if (remote.cycleArchive.offerAccepted) localStorage.setItem(OFFER_ACCEPTED_FLAG_KEY, "true");
                localStorage.setItem(TRACKR_PAUSED_FLAG_KEY, "true");
              } catch {}
              setCycleArchive(remote.cycleArchive);
              setApps(normalizedRemoteApps);
            } else {
              if (forceRemote && !remote.cycleArchive) {
                try {
                  localStorage.removeItem(CYCLE_ARCHIVE_KEY);
                  localStorage.removeItem(CYCLE_ARCHIVE_HUMAN_KEY);
                  localStorage.removeItem(OFFER_ACCEPTED_FLAG_KEY);
                  localStorage.removeItem(TRACKR_PAUSED_FLAG_KEY);
                } catch {}
                setCycleArchive(null);
              }
              const nextApps = forceRemote || !hasLocalData
                ? normalizedRemoteApps
                : sanitizeAndDedupeApps(smartMergeApps(normalizedRemoteApps, localAppsNow), mergedDeletedIds);
              setApps(nextApps);
            }
            if (remoteUpdatedAt) {
              try { localStorage.setItem(LOCAL_UPDATED_AT_KEY, remoteUpdatedAt); } catch {}
            }
          }

          if (ghToken) {
            setCloudSyncStatus("synced");
            const tLabel = new Date().toLocaleTimeString("en-GB", { timeZone: "Europe/London" });
            setLastCloudSyncAt(tLabel);
            setCloudSyncMsg(`Synced from ${source === "github-api" ? "GitHub Cloud" : "cloud"} at ${tLabel}`);
          }
          return { remote, source };
        } catch (err) {
          if (!silent) {
            setCloudSyncStatus("offline");
            setCloudSyncMsg("Offline — using localStorage cache.");

      useEffect(() => {

      const handleTestAndSaveToken = async (e) => {
        e.preventDefault();
        const trimmedToken = tokenDraft.trim();
        const nextCfg = {
          owner: (configDraft.owner || DEFAULT_GITHUB_CONFIG.owner).trim(),
          repo: (configDraft.repo || DEFAULT_GITHUB_CONFIG.repo).trim(),
          branch: (configDraft.branch || DEFAULT_GITHUB_CONFIG.branch).trim()
        };
        if (!trimmedToken) {
          setCloudSyncMsg("Please paste a GitHub Personal Access Token first.");
          return;
        }
        setIsTestingToken(true);
        setCloudSyncMsg("Verifying token against GitHub API…");
        try {
          const check = await githubGetFile(trimmedToken, nextCfg, "state.json");
          if (!check) throw new Error("Could not find state.json in that repository/branch.");
          localStorage.setItem(GITHUB_TOKEN_KEY, trimmedToken);

          setGhConfig(nextCfg);

          setCloudSyncMsg(`Connected to ${nextCfg.owner}/${nextCfg.repo} (${nextCfg.branch}) ✓`);
