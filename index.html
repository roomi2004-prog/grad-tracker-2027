            ok: true,
            time: tLabel,
            message: `Cloud Sync Token verified & saved locally. All edits will now auto-sync to ${nextCfg.owner}/${nextCfg.repo}.`,
            emails: []
          });
        } catch (err) {
          setCloudSyncStatus("error");
          setCloudSyncMsg(err && err.message ? err.message : "Token verification failed.");
        } finally {
          setIsTestingToken(false);
        }
      };

      const handleRemoveGithubToken = () => {
        try { localStorage.removeItem(GITHUB_TOKEN_KEY); } catch {}
        setGhToken("");
        setTokenDraft("");
        setCloudSyncStatus("unconfigured");
        setCloudSyncMsg("Token removed from this device.");
      };

      // Active recommendations: excludes any role already applied/dismissed in handledRecs,
      // already present in apps, OR from ANY company the user has already applied to (active or archived).
      const appliedFirmKeys = useMemo(() => {
        const keys = new Set();
        const archivedApps = Array.isArray(cycleArchive?.archivedApplications) ? cycleArchive.archivedApplications : [];
        for (const a of [...apps, ...archivedApps]) {
          const fk = canonicalFirmKey(a.company || a.firm);
          if (fk) keys.add(fk);
        }
        return keys;
      }, [apps, cycleArchive]);

      const shortlistedRecSet = useMemo(() => new Set(shortlistedRecs), [shortlistedRecs]);

      const isRecShortlisted = (rec) => {
        if (!rec) return false;
        const slug = makeRecSlug(rec.company, rec.role);
        return shortlistedRecSet.has(rec.id) || shortlistedRecSet.has(slug);
      };

      const isRecSnoozed = (rec, nowMs = Date.now()) => {
        if (!rec) return false;
        const slug = makeRecSlug(rec.company, rec.role);
        const exp = snoozedRecs[rec.id] || snoozedRecs[slug];
        return Boolean(exp) && new Date(exp).getTime() > nowMs;
      };

      const snoozeMinuteTick = Math.floor(now / 60000);

      const unhandledRecommendations = useMemo(() => {
        const handledSet = new Set(handledRecs);
        const existingAppSlugs = new Set(apps.map(a => makeRecSlug(a.company, a.role)));
        if (recsPaused) return [];
        return rawRecs.filter(rec => {
          const slug = makeRecSlug(rec.company, rec.role);
          const firmKey = canonicalFirmKey(rec.company);
          return (
            !handledSet.has(rec.id) &&
            !handledSet.has(slug) &&
            !existingAppSlugs.has(slug) &&
            !(firmKey && appliedFirmKeys.has(firmKey))
          );
        });
      }, [rawRecs, handledRecs, apps, appliedFirmKeys, recsPaused]);

      // Roles dismissed in the last 7 days are archived (hidden) and automatically return afterwards
      const archivedRecommendations = useMemo(() => {
        const nowMs = Date.now();
        return unhandledRecommendations
          .filter(rec => isRecSnoozed(rec, nowMs))
          .sort((a, b) => {
            const ea = snoozedRecs[a.id] || snoozedRecs[makeRecSlug(a.company, a.role)] || "";
            const eb = snoozedRecs[b.id] || snoozedRecs[makeRecSlug(b.company, b.role)] || "";
            return String(ea).localeCompare(String(eb));
          });
      }, [unhandledRecommendations, snoozedRecs, snoozeMinuteTick]);

      const visibleRecommendations = useMemo(() => {
        const nowMs = Date.now();
        return unhandledRecommendations.filter(rec => !isRecSnoozed(rec, nowMs));
      }, [unhandledRecommendations, snoozedRecs, snoozeMinuteTick]);

      // Shortlisted roles live ONLY in the Shortlisted tab — they are removed from All / Trackr / Gradcracker / Email tabs
      const activeRecommendations = useMemo(() => {
        if (recSourceFilter === "Archived") return archivedRecommendations;
        if (recSourceFilter === "Shortlisted") {
          return visibleRecommendations.filter(rec => isRecShortlisted(rec));
        }
        return visibleRecommendations.filter(rec => {
          if (isRecShortlisted(rec)) return false;
          if (recSourceFilter !== "All" && rec.source !== recSourceFilter) return false;
          return true;
        });
      }, [visibleRecommendations, archivedRecommendations, recSourceFilter, shortlistedRecSet]);

      const totalUnhandledRecsCount = useMemo(
        () => visibleRecommendations.filter(rec => !isRecShortlisted(rec)).length,
        [visibleRecommendations, shortlistedRecSet]
      );

      const shortlistedRecsCount = useMemo(() => {
        return visibleRecommendations.filter(rec => isRecShortlisted(rec)).length;
      }, [visibleRecommendations, shortlistedRecSet]);

      const archivedRecsCount = archivedRecommendations.length;

      const handleToggleShortlistRecommendation = (rec) => {
        const slug = makeRecSlug(rec.company, rec.role);
        const currentlyShortlisted = shortlistedRecSet.has(rec.id) || shortlistedRecSet.has(slug);
        const nextShortlisted = currentlyShortlisted
          ? shortlistedRecs.filter(k => k !== rec.id && k !== slug)
          : Array.from(new Set([...shortlistedRecs, rec.id, slug]));
        setShortlistedRecs(nextShortlisted);
        pushSnapshotToCloud(
          { shortlistedRecIds: nextShortlisted },
          `${currentlyShortlisted ? "Removed from shortlist" : "Shortlisted"}: ${rec.company} — ${rec.role}`
        );
      };

      // One-Click "Applied" on a Recommended Role:
      // Moves role out of "Recommended to Apply", adds into main tracker under "Application Submitted" with today's date,
      // and persists both in localStorage so future hourly/daily syncs never re-add it.
      const handleMarkRecommendedApplied = (rec) => {
        const today = new Date().toISOString().slice(0, 10);
        const slug = makeRecSlug(rec.company, rec.role);
        const newAppEntry = {
          id: Date.now(),
          category: "internship",
          company: rec.company,
          role: rec.role,
          sector: rec.sector || "Corporate & Investment Banking",
          appliedDate: today,
          stage: "Application Submitted",
          subStatus: `Applied via ${rec.source === "Trackr" ? "The Trackr" : rec.source === "Gradcracker" ? "Gradcracker" : (rec.sourceDetail || "Email Alert")} (${today.slice(5)})`,
          deadline: null,
          portalLink: rec.applyLink || "",
          calendarSynced: false,
          notes: `Applied on ${today} from Recommended to Apply (${rec.sourceDetail || rec.source}). ${rec.notes || ""}`.trim(),
          _gmailSubStatus: `Applied via ${rec.source === "Trackr" ? "The Trackr" : (rec.sourceDetail || "Email Alert")} (${today.slice(5)})`,
          _gmailDeadline: null
        };

        const nextApps = [newAppEntry, ...rawApps];
        const nextHandled = Array.from(new Set([...handledRecs, rec.id, slug]));
        const nextShortlisted = shortlistedRecs.filter(k => k !== rec.id && k !== slug);
        setApps(nextApps);
        setHandledRecs(nextHandled);
        setShortlistedRecs(nextShortlisted);
        pushSnapshotToCloud(
          { applications: nextApps, handledRecIds: nextHandled, shortlistedRecIds: nextShortlisted },
          `Applied: ${rec.company} — ${rec.role}`
        );
        setSyncStatus({
          ok: true,
          time: new Date().toLocaleTimeString("en-GB", { timeZone: "Europe/London" }),
          message: `Added "${rec.company} — ${rec.role}" to Application Submitted (${today}) and removed from recommendations.`,
          emails: []
        });
      };

      // Dismiss = archive for 7 days (role automatically returns afterwards). Shortlist is cleared on dismiss.
      const handleDismissRecommendation = (rec) => {
        const slug = makeRecSlug(rec.company, rec.role);
        const expiry = new Date(Date.now() + SNOOZE_DAYS * 24 * 60 * 60 * 1000).toISOString();
        const nextSnoozed = { ...snoozedRecs, [rec.id]: expiry, [slug]: expiry };
        const nextShortlisted = shortlistedRecs.filter(k => k !== rec.id && k !== slug);
        setSnoozedRecs(nextSnoozed);
        setShortlistedRecs(nextShortlisted);
        pushSnapshotToCloud(
          { snoozedRecs: nextSnoozed, shortlistedRecIds: nextShortlisted },
          `Archived for ${SNOOZE_DAYS} days: ${rec.company}`
        );
      };

      const handleRestoreArchivedRecommendation = (rec) => {
        const slug = makeRecSlug(rec.company, rec.role);
        const nextSnoozed = { ...snoozedRecs };
        delete nextSnoozed[rec.id];
        delete nextSnoozed[slug];
        setSnoozedRecs(nextSnoozed);
        pushSnapshotToCloud(
          { snoozedRecs: nextSnoozed },
          `Restored from archive: ${rec.company}`
        );
      };

      const handleBackupJson = () => {
        try {
          const dateSlug = new Date().toISOString().slice(0, 10);
          const payload = {
            version: 6,
            exportedAt: new Date().toISOString(),
            theme,
            handledRecommendations: handledRecs,
            shortlistedRecommendations: shortlistedRecs,
            applications: apps
          };
          const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = `grad-tracker-2027-backup-${dateSlug}.json`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          setSyncStatus({
            ok: true,
            time: new Date().toLocaleTimeString("en-GB", { timeZone: "Europe/London" }),
            message: `Exported ${apps.length} applications to grad-tracker-2027-backup-${dateSlug}.json.`,
            emails: []
          });
        } catch {
          setSyncStatus({
            ok: false,
            time: new Date().toLocaleTimeString("en-GB", { timeZone: "Europe/London" }),
            message: "Failed to export JSON backup.",
            emails: []
          });
        }
      };

      const handleRestoreJson = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const parsed = JSON.parse(ev.target.result);
            const restoredApps = Array.isArray(parsed)
              ? parsed
              : (parsed && Array.isArray(parsed.applications) ? parsed.applications : null);
            if (!restoredApps || restoredApps.length === 0) {
              throw new Error("Invalid backup format");
            }
            if (parsed && parsed.theme && THEME_PRESETS.some(t => t.id === parsed.theme)) {
              setTheme(parsed.theme);
            }
            const nextHandled = parsed && Array.isArray(parsed.handledRecommendations)
              ? Array.from(new Set([...handledRecs, ...parsed.handledRecommendations]))
              : handledRecs;
            if (nextHandled !== handledRecs) setHandledRecs(nextHandled);
            const nextShortlisted = parsed && Array.isArray(parsed.shortlistedRecommendations)
              ? Array.from(new Set([...shortlistedRecs, ...parsed.shortlistedRecommendations]))
              : shortlistedRecs;
            if (nextShortlisted !== shortlistedRecs) setShortlistedRecs(nextShortlisted);
            const merged = smartMergeApps(rawApps, restoredApps);
            setApps(merged);
            pushSnapshotToCloud(
              { applications: merged, handledRecIds: nextHandled, shortlistedRecIds: nextShortlisted },
              `Restored backup from ${file.name}`
            );
            setSyncStatus({
              ok: true,
              time: new Date().toLocaleTimeString("en-GB", { timeZone: "Europe/London" }),
              message: `Restored & smart-merged ${merged.length} applications from ${file.name}.`,
              emails: []
            });
          } catch {
            setSyncStatus({
              ok: false,
              time: new Date().toLocaleTimeString("en-GB", { timeZone: "Europe/London" }),
              message: `Could not restore from ${file.name}: invalid JSON backup file.`,
              emails: []
            });
          } finally {
            e.target.value = "";
          }
        };
        reader.readAsText(file);
      };

      const [newApp, setNewApp] = useState({
        company: "", role: "", sector: "Investment Management",
        appliedDate: new Date().toISOString().slice(0, 10),
        stage: "Action Required", rejectedAfterStage: "CV / Application Screen",
        subStatus: "Stage 1: Online Assessment Invited",
        deadline: "", portalLink: "", notes: "", category: "internship"
      });

      const currentThemeObj = useMemo(
        () => THEME_PRESETS.find(t => t.id === theme) || THEME_PRESETS[3],
        [theme]
      );

      // Gmail-only live sync (header "Sync Now"): pings the Gmail Apps Script, then pulls the latest cloud state.
      const handleRefreshEmail = async () => {
        if (isRefreshing) return;
        setIsRefreshing(true);
        setLiveSyncToast(null);
        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));
        const fmtNow = () => new Date().toLocaleTimeString("en-GB", { timeZone: "Europe/London" });

        try {
          setLiveSyncStage({ phase: "step1", text: "1/2 Scanning Gmail..." });
          await fetch(GMAIL_WEBAPP_URL, {
            method: "GET",
            mode: "no-cors",
            cache: "no-store"
          }).catch(() => {});

          await sleep(4000);
          setLiveSyncStage({ phase: "step2", text: "2/2 Pulling Gmail updates..." });
          const pull = await pullFromMasterState({ forceRemote: true, silent: false });

          const doneTime = fmtNow();
          const appCount = pull && pull.remote ? pull.remote.applications.length : rawApps.length;
          setLiveSyncStage({ phase: "done", text: "Gmail Synced", time: doneTime });
          setSyncStatus({
            ok: Boolean(pull),
            time: doneTime,
            message: pull
              ? `Gmail scanned & dashboard refreshed (${appCount} applications).`
              : "Offline or unreachable — showing your locally cached applications.",
            emails: []
          });
        } catch (err) {
          setLiveSyncStage(null);
          setSyncStatus({
            ok: false,
            time: fmtNow(),
            message: `Sync error: ${err && err.message ? err.message : "Could not complete Gmail sync."}`,
            emails: []
          });
        } finally {
          setIsRefreshing(false);
        }
      };

      // Trackr-only live sync (button inside "Recommended to Apply"): dispatches the scraper workflow and polls until done.
      const handleTrackrSync = async () => {
        if (isTrackrSyncing) return;
        setIsTrackrSyncing(true);
        setLiveSyncToast(null);
        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));
        const fmtNow = () => new Date().toLocaleTimeString("en-GB", { timeZone: "Europe/London" });
        const owner = ghConfig.owner || DEFAULT_GITHUB_CONFIG.owner;
        const repo = ghConfig.repo || DEFAULT_GITHUB_CONFIG.repo;
        const branch = ghConfig.branch || DEFAULT_GITHUB_CONFIG.branch;
        const dispatchStartedMs = Date.now() - 4000;

        try {
          setTrackrSyncStage({ phase: "step1", text: "Starting Trackr scrape..." });

          let trackrDispatched = false;
          let tokenPermissionIssue = null;

          if (!ghToken) {
            tokenPermissionIssue = "GitHub token not configured. Open Cloud Sync Token (bottom footer) and save a token with Contents & Actions (Read and write) permissions to enable live Trackr scraping.";
          } else {
            try {
              const dispatchUrl = `https://api.github.com/repos/${owner}/${repo}/actions/workflows/${TRACKR_WORKFLOW_FILE}/dispatches`;
              const dispatchRes = await fetch(dispatchUrl, {
                method: "POST",
                headers: {
                  Authorization: `Bearer ${ghToken}`,
                  Accept: "application/vnd.github+json",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28"
                },
                body: JSON.stringify({ ref: branch })
              });
              if (dispatchRes.ok || dispatchRes.status === 204) {
                trackrDispatched = true;
              } else if (dispatchRes.status === 401 || dispatchRes.status === 403) {
                tokenPermissionIssue = "Your GitHub token lacks Actions: Read and write permission. Enable Actions (Read and write) on your fine-grained PAT in GitHub Settings, then update Cloud Sync Token in the footer.";
              } else {
                const errTxt = await dispatchRes.text().catch(() => "");
                tokenPermissionIssue = `Could not dispatch Trackr workflow (HTTP ${dispatchRes.status}${errTxt ? `: ${errTxt.slice(0, 100)}` : ""}). Check Actions: Read and write permission on your GitHub token.`;
              }
            } catch (err) {
              tokenPermissionIssue = `Network error triggering Trackr workflow: ${err && err.message ? err.message : "offline"}.`;
            }
          }

          if (tokenPermissionIssue) {
            setLiveSyncToast({ type: "warning", message: tokenPermissionIssue });
          }

          if (trackrDispatched && ghToken) {
            setTrackrSyncStage({ phase: "step2", text: "Scraping Trackr..." });
            const pollStart = Date.now();
            const maxPollMs = 90000;
            let completedRun = null;

            while (Date.now() - pollStart < maxPollMs) {
              await sleep(5000);
              const elapsedSec = Math.min(90, Math.round((Date.now() - pollStart) / 1000));
              try {
                const runsUrl = `https://api.github.com/repos/${owner}/${repo}/actions/workflows/${TRACKR_WORKFLOW_FILE}/runs?per_page=1&t=${Date.now()}`;
                const runsRes = await fetch(runsUrl, {
                  headers: {
                    Authorization: `Bearer ${ghToken}`,
                    Accept: "application/vnd.github+json",
                    "X-GitHub-Api-Version": "2022-11-28"
                  },
                  cache: "no-store"
                });
                if (runsRes.status === 401 || runsRes.status === 403) {
                  setLiveSyncToast({
                    type: "warning",
                    message: "GitHub token lacks Actions: Read and write permission to poll workflow runs. Enable Actions permission on your PAT."
                  });
                  break;
                }
                if (runsRes.ok) {
                  const runsJson = await runsRes.json();
                  const latestRun = runsJson && Array.isArray(runsJson.workflow_runs) ? runsJson.workflow_runs[0] : null;
                  if (latestRun) {
                    const createdMs = new Date(latestRun.created_at).getTime();
                    const isCurrentRun = Number.isNaN(createdMs) || createdMs >= dispatchStartedMs;
                    if (isCurrentRun && latestRun.status === "completed") {
                      completedRun = latestRun;
                      break;
                    }
                    setTrackrSyncStage({ phase: "step2", text: `Scraping Trackr... (${elapsedSec}s)` });
                  }
                }
              } catch {}
            }

            const finalPull = await pullFromMasterState({ forceRemote: true, silent: false });
            const doneTime = fmtNow();
            const recCount = finalPull && finalPull.remote ? (finalPull.remote.recommendations || []).length : rawRecs.length;
            setTrackrSyncStage({ phase: "done", text: completedRun ? "Trackr Updated" : "Trackr Refreshed", time: doneTime });
            setSyncStatus({
              ok: true,
              time: doneTime,
              message: completedRun
                ? `Trackr scrape complete — ${recCount} recommendations available.`
                : `Recommendations refreshed (${recCount}). Trackr is still finishing in the background.`,
              emails: []
            });
          } else {
            setTrackrSyncStage(null);
          }
        } catch (err) {
          setTrackrSyncStage(null);
          setSyncStatus({
            ok: false,
            time: fmtNow(),
            message: `Trackr sync error: ${err && err.message ? err.message : "Could not complete Trackr sync."}`,
            emails: []
          });
        } finally {
          setIsTrackrSyncing(false);
        }
      };

      const categoryApps = useMemo(() => {
        if (roleCategory === "successful") {
          return apps.filter(a => a.stage === "Offer / Successful");
        }
        return apps.filter(a => a.category === roleCategory);
      }, [apps, roleCategory]);
      const sectors = useMemo(() => ["All", ...new Set(categoryApps.map(a => a.sector))], [categoryApps]);

      const filteredApps = useMemo(() => {
        const list = categoryApps.filter(app => {
          const q = search.toLowerCase();
          const matchesSearch = String(app.company || "").toLowerCase().includes(q) ||
            String(app.role || "").toLowerCase().includes(q) ||
            String(app.subStatus || "").toLowerCase().includes(q);
          const matchesSector = sectorFilter === "All" || app.sector === sectorFilter;
          const matchesStage = stageFilter === "All" || app.stage === stageFilter;
          const matchesRejection = rejectionFilter === "All" ||
            (app.stage === "Closed / Unsuccessful" && (app.rejectedAfterStage || "CV / Application Screen") === rejectionFilter);
          return matchesSearch && matchesSector && matchesStage && ((activeTab !== "table" && activeTab !== "calendar") || rejectionFilter === "All" || matchesRejection);
        });

        return [...list].sort((a, b) => {
          if (sortBy === "company") return a.company.localeCompare(b.company);
          if (sortBy === "deadline") {
            const da = a.deadline || "9999-12-31";
            const db = b.deadline || "9999-12-31";
            return da.localeCompare(db) || b.appliedDate.localeCompare(a.appliedDate);
          }
          if (sortBy === "sector") return a.sector.localeCompare(b.sector) || a.company.localeCompare(b.company);
          return b.appliedDate.localeCompare(a.appliedDate) || a.company.localeCompare(b.company);
        });
      }, [categoryApps, search, sectorFilter, stageFilter, rejectionFilter, activeTab, sortBy]);

      const visibleStages = useMemo(() => {
        if (stageFilter !== "All") {
          return STAGES.filter(s => s.id === stageFilter);
        }
        if (!hideArchivedCols) return STAGES;
        return STAGES.filter(s => s.id !== "Closed / Unsuccessful" && s.id !== "On Hold / Waitlist");
      }, [hideArchivedCols, stageFilter]);

      const isPendingAssessment = (app) => {
        if (!app) return false;
        if (app.stage === "Closed / Unsuccessful" || app.stage === "Offer / Successful") return false;
        if (app.stage === "Action Required") return true;
        if (app.deadline) return true;
        const sub = String(app.subStatus || app.status || "").toLowerCase();
        if (/\b(completed|submitted|under review|awaiting|on hold|received)\b/.test(sub)) return false;
        return /\b(due|invited|invitation|pending|action required|to complete|reapply|book|schedule)\b/.test(sub);
      };

      const urgentItems = useMemo(() => {
        return apps
          .filter(isPendingAssessment)
          .sort((a, b) => (a.deadline || "9999").localeCompare(b.deadline || "9999") || String(b.appliedDate || "").localeCompare(String(a.appliedDate || "")));
      }, [apps]);

      const handleMarkAssessmentDone = (item) => {
        if (viewArchiveMode) return;
        const todayShort = new Date().toLocaleDateString("en-GB", { day: "numeric", month: "short" });
        const nextStage = item.stage === "Action Required" ? "Stage 1 - Online Assessment" : item.stage;
        const cleanedSub = String(item.subStatus || "Assessment")
          .replace(/\b(due|pending|invited|invitation|action required)\b/gi, "")
          .replace(/\s{2,}/g, " ")
          .trim();
        const nextSub = `${cleanedSub || "Assessment"} Completed (${todayShort})`;
        const nextApps = rawApps.map(a => a.id === item.id ? {
          ...a,
          stage: nextStage,
          subStatus: nextSub,
          deadline: null
        } : a);
        setApps(nextApps);
        pushSnapshotToCloud({ applications: nextApps }, `Completed assessment: ${item.company}`);
      };

      const stats = useMemo(() => {
        const internships = apps.filter(a => a.category === "internship");
        const total = internships.length;
        const action = internships.filter(a => a.stage === "Action Required").length;
        const submitted = internships.filter(a => a.stage === "Application Submitted").length;
        const stage1 = internships.filter(a => a.stage === "Stage 1 - Online Assessment").length;
        const stage2 = internships.filter(a => a.stage === "Stage 2 - Video Interview").length;
        const stage3 = internships.filter(a => a.stage === "Stage 3 - Assessment Centre").length;
        const offers = internships.filter(a => a.stage === "Offer / Successful").length;
        const allOffers = apps.filter(a => a.stage === "Offer / Successful").length;
        const closed = internships.filter(a => a.stage === "Closed / Unsuccessful");
        const closedAfterOA = closed.filter(a => a.rejectedAfterStage === "Stage 1 - Online Assessment").length;
        const closedAfterVI = closed.filter(a => a.rejectedAfterStage === "Stage 2 - Video Interview").length;
        const closedAfterAC = closed.filter(a => a.rejectedAfterStage === "Stage 3 - Assessment Centre").length;
        const closedAfterCV = closed.length - closedAfterOA - closedAfterVI - closedAfterAC;
        const active = internships.filter(a => a.stage !== "Closed / Unsuccessful").length;
        const everReachedStage1Plus = action + stage1 + stage2 + stage3 + offers + closedAfterOA + closedAfterVI + closedAfterAC;
        const progressionRate = total > 0 ? Math.round((everReachedStage1Plus / total) * 100) : 0;
        return {
          total, action, submitted, stage1, stage2, stage3, offers, allOffers, active,
          everReachedStage1Plus, progressionRate,
          closedTotal: closed.length, closedAfterCV, closedAfterOA, closedAfterVI, closedAfterAC
        };
      }, [apps]);

      const updateAppStage = (id, newStage) => {
        let movedName = "";
        const nextApps = rawApps.map(a => {
          if (a.id !== id) return a;
          movedName = a.company;
          const nextRejected = newStage === "Closed / Unsuccessful"
            ? inferRejectedAfterStage(a.stage, a.rejectedAfterStage)
            : a.rejectedAfterStage;
          return { ...a, stage: newStage, rejectedAfterStage: nextRejected };
        });
        setApps(nextApps);
        if (movedName) {
          pushSnapshotToCloud({ applications: nextApps }, `Move ${movedName} to ${newStage}`);
        }
        if (selectedApp && selectedApp.id === id) {
          setSelectedApp(prev => ({
            ...prev,
            stage: newStage,
            rejectedAfterStage: newStage === "Closed / Unsuccessful"
              ? inferRejectedAfterStage(prev.stage, prev.rejectedAfterStage)
              : prev.rejectedAfterStage
          }));
        }
      };

      const handleDragStart = (e, appId) => {
        setDraggedAppId(appId);
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("text/plain", String(appId));
      };

      const handleDragOver = (e, stageId) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = "move";
        if (dragOverStage !== stageId) setDragOverStage(stageId);
      };

      const handleDrop = (e, targetStageId) => {
        e.preventDefault();
        const rawId = e.dataTransfer.getData("text/plain");
        const id = draggedAppId || Number(rawId);
        if (id && !viewArchiveMode) {
          updateAppStage(id, targetStageId);
        }
        setDraggedAppId(null);
        setDragOverStage(null);
      };

      const handleDeleteApp = (id) => {
        const target = rawApps.find(a => a.id === id);
        if (!target) return;
        if (!confirm(`Delete "${target.company} — ${target.role}" from your tracker?`)) return;
        const nextApps = rawApps.filter(a => a.id !== id);
        const nextDeleted = Array.from(new Set([...deletedAppIds, String(id)]));
        setApps(nextApps);
        setDeletedAppIds(nextDeleted);
        setSelectedApp(null);
        pushSnapshotToCloud({ applications: nextApps, deletedAppIds: nextDeleted }, `Delete ${target.company}`);
      };

      useEffect(() => {
        const onKey = (e) => {
          if (e.key !== "Escape") return;
          setSelectedApp(null);
          setShowAddModal(false);
          setShowAcceptOfferModal(false);
          setShowForceArchiveModal(false);
          setShowExternalOfferModal(false);
          setShowCloudSyncModal(false);
          setHeaderSearchOpen(false);
          closeTwerkEasterEgg();
        };
        window.addEventListener("keydown", onKey);
        return () => window.removeEventListener("keydown", onKey);
      }, []);

      const handleSaveEdit = (updated) => {
        const nextApps = rawApps.map(a => a.id === updated.id ? updated : a);
        setApps(nextApps);
        setSelectedApp(null);
        pushSnapshotToCloud({ applications: nextApps }, `Update ${updated.company}`);
      };

      const handleAddApp = (e) => {
        e.preventDefault();
        if (!newApp.company || !newApp.role) return;
        const item = {
          ...newApp,
          id: Date.now(),
          deadline: newApp.deadline || null,
          calendarSynced: Boolean(newApp.deadline),
          rejectedAfterStage: newApp.stage === "Closed / Unsuccessful" ? (newApp.rejectedAfterStage || "CV / Application Screen") : null
        };
        const nextApps = [item, ...rawApps];
        setApps(nextApps);
        setShowAddModal(false);
        pushSnapshotToCloud({ applications: nextApps }, `Add role: ${item.company}`);
        setNewApp({
          company: "", role: "", sector: "Investment Management",
          appliedDate: new Date().toISOString().slice(0, 10),
          stage: "Action Required", rejectedAfterStage: "CV / Application Screen",
          subStatus: "Stage 1: Online Assessment Invited",
          deadline: "", portalLink: "", notes: "", category: roleCategory
        });
      };

      const acceptableOffers = useMemo(() => rawApps.filter(a => a.category === "internship" && a.stage === "Offer / Successful"), [rawApps]);

      const openAcceptOfferModal = (preApp = null) => {
        const first = preApp || acceptableOffers[0] || null;
        setSelectedOfferChoice(first ? String(first.id) : "");
        setCustomOfferCompany("");
        setCustomOfferRole("");
        setShowAcceptOfferModal(true);
      };

      const cycleStats = useMemo(() => ({
        totalApplications: stats.total,
        allTrackedRoles: rawApps.length,
        onlineAssessments: stats.stage1 + stats.stage2 + stats.stage3 + stats.closedAfterOA + stats.closedAfterVI + stats.closedAfterAC + stats.offers,
        videoInterviews: stats.stage2 + stats.stage3 + stats.closedAfterVI + stats.closedAfterAC + stats.offers,
        assessmentCentres: stats.stage3 + stats.closedAfterAC + stats.offers,
        progressionRate: stats.progressionRate,
        offers: Math.max(stats.allOffers, 1)
      }), [stats, rawApps]);

      const handleConfirmAcceptOffer = (e) => {
        e.preventDefault();
        const today = new Date().toISOString().slice(0, 10);
        let chosen;
        if (!selectedOfferChoice) return;
        if (selectedOfferChoice === "custom") {
          if (!customOfferCompany.trim() || !customOfferRole.trim()) return;
          chosen = {
            id: Date.now(), category: "internship",
            company: customOfferCompany.trim(), role: customOfferRole.trim(),
            sector: customOfferSector, appliedDate: today, stage: "Offer / Successful",
            subStatus: "Offer accepted", deadline: null, portalLink: "", notes: ""
          };
        } else {
          chosen = acceptableOffers.find(a => String(a.id) === String(selectedOfferChoice));
          if (!chosen) return;
        }
        const payload = {
          offerAccepted: true,
          recommendationsPaused: true,
          archivedAt: new Date().toISOString(),
          acceptedOffer: { ...chosen, stage: "Offer / Successful", acceptedDate: today },
          cycleStats,
          archivedApplications: rawApps.filter(a => a.category === "internship"),
          archivedHandledRecs: handledRecs
        };
        try {
          const json = JSON.stringify(payload);
          localStorage.setItem(CYCLE_ARCHIVE_KEY, json);
          localStorage.setItem(CYCLE_ARCHIVE_HUMAN_KEY, json);
          localStorage.setItem(OFFER_ACCEPTED_FLAG_KEY, "true");
          localStorage.setItem(TRACKR_PAUSED_FLAG_KEY, "true");
          localStorage.setItem(STORAGE_KEY, JSON.stringify(rawApps.filter(a => a.category !== "internship")));
        } catch {}
        try {
          const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = `grad-tracker-2027-cycle-archive-${today}.json`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        } catch {}
        const remainingApps = rawApps.filter(a => a.category !== "internship");
        setCycleArchive(payload);
        setApps(remainingApps);
        setViewArchiveMode(false);
        setSelectedApp(null);
        setStageFilter("All");
        setShowAcceptOfferModal(false);
        startOfferCelebration();
        pushSnapshotToCloud(
          { applications: remainingApps, cycleArchive: payload },
          `Accepted offer & archived cycle: ${chosen.company}`
        );
        setSyncStatus({
          ok: true,
          time: new Date().toLocaleTimeString("en-GB", { timeZone: "Europe/London" }),
          message: `Accepted ${chosen.company} — cycle archived (${payload.archivedApplications.length} applications) and backup JSON downloaded.`,
          emails: []
        });
      };

      const openForceArchiveModal = () => {
        setForceArchiveStep(1);
        setForceArchiveLabel("2027 Internship Cycle");
        setForceArchiveReason("");
        setForceArchiveConfirmText("");
        setShowForceArchiveModal(true);
      };

      const handleConfirmForceArchive = (e) => {
        e.preventDefault();
        if (forceArchiveStep === 1) {
          setForceArchiveStep(2);
          return;
        }
        if (forceArchiveConfirmText.trim().toUpperCase() !== "ARCHIVE") return;
        const today = localTodayStr();
        const internshipApps = rawApps.filter(a => a.category === "internship");
        const remainingApps = rawApps.filter(a => a.category !== "internship");
        const label = forceArchiveLabel.trim() || "2027 Internship Cycle";
        const payload = {
          archived: true,
          offerAccepted: false,
          recommendationsPaused: true,
          archiveLabel: label,
          archiveReason: forceArchiveReason.trim() || "Manually archived cycle",
          archivedDate: today,
          archivedAt: new Date().toISOString(),
          acceptedOffer: null,
          cycleStats,
          archivedApplications: internshipApps,
          archivedHandledRecs: handledRecs
        };
        try {
          const json = JSON.stringify(payload);
          localStorage.setItem(CYCLE_ARCHIVE_KEY, json);
          localStorage.setItem(CYCLE_ARCHIVE_HUMAN_KEY, json);
          localStorage.setItem(TRACKR_PAUSED_FLAG_KEY, "true");
          localStorage.setItem(STORAGE_KEY, JSON.stringify(remainingApps));
        } catch {}
        try {
          const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = `grad-tracker-2027-cycle-archive-${today}.json`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        } catch {}
        setCycleArchive(payload);
        setApps(remainingApps);
        setViewArchiveMode(false);
        setSelectedApp(null);
        setStageFilter("All");
        setShowForceArchiveModal(false);
        pushSnapshotToCloud(
          { applications: remainingApps, cycleArchive: payload },
          `Force-archived cycle: ${label}`
        );
        setSyncStatus({
          ok: true,
          time: new Date().toLocaleTimeString("en-GB", { timeZone: "Europe/London" }),
          message: `Force-archived "${label}" (${internshipApps.length} internship applications saved, backup JSON downloaded, part-time roles untouched).`,
          emails: []
        });
      };

      const handleReopenCycle = () => {
        if (!cycleArchive) return;
        if (!confirm("Reopen the 2027 cycle? Archived applications return to the active board and recommendations resume.")) return;
        const archivedIds = new Set((cycleArchive.archivedApplications || []).map(a => a.id));
        const restored = [...(cycleArchive.archivedApplications || []), ...rawApps.filter(a => !archivedIds.has(a.id))];
        try {
          localStorage.removeItem(CYCLE_ARCHIVE_KEY);
          localStorage.removeItem(CYCLE_ARCHIVE_HUMAN_KEY);
          localStorage.removeItem(OFFER_ACCEPTED_FLAG_KEY);
          localStorage.removeItem(TRACKR_PAUSED_FLAG_KEY);
          localStorage.setItem(STORAGE_KEY, JSON.stringify(restored));
        } catch {}
        setCycleArchive(null);
        setViewArchiveMode(false);
        setApps(restored);
        pushSnapshotToCloud(
          { applications: restored, cycleArchive: null },

          isExternalOffer: true,

      const calendarDays = useMemo(() => {

        const firstDay = new Date(year, month - 1, 1).getDay();
        const startOffset = (firstDay + 6) % 7;
        const daysInMonth = new Date(year, month, 0).getDate();
        const cells = [];
        for (let i = 0; i < startOffset; i++) cells.push(null);
        for (let d = 1; d <= daysInMonth; d++) {
          const dateStr = `${year}-${String(month).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
          const deadlines = filteredApps.filter(a => a.deadline && a.deadline.startsWith(dateStr));
          const applied = filteredApps.filter(a => a.appliedDate === dateStr);

        return cells;

                <input

            {cycleArchive && cycleArchive.archived && !cycleArchive.offerAccepted && (

                    </div>

                      <div className="text-[11px] font-bold uppercase tracking-wider text-amber-300 flex items-center gap-1.5">
                        Archived Cycle

                    </div>
                  </div>
                  <div className="flex flex-wrap items-center gap-1.5 text-[11px] font-mono-num">
                    {[
                      ["Total Apps", cycleArchive.cycleStats.totalApplications],
                      ["OAs", cycleArchive.cycleStats.onlineAssessments],

                    ].map(([l, v]) => (

            {/* Inline Toast for Missing GitHub Token or Missing Actions Permission */}
            {liveSyncToast && (
              <div className="glass-surface rounded-2xl p-3.5 flex flex-col sm:flex-row sm:items-center justify-between gap-3 border border-amber-500/40 bg-amber-950/30 text-amber-200">

                          value={forceArchiveLabel}
                          onChange={e => setForceArchiveLabel(e.target.value)}
                          placeholder="e.g. 2027 Internship Cycle"
                          className="w-full theme-input rounded-xl px-3 py-2"
                        />
                      </div>
                      <div>
                        <label className="block text-slate-400 mb-1">Reason / Note (Optional)</label>
                        <input
                          type="text"
                          value={forceArchiveReason}
                          onChange={e => setForceArchiveReason(e.target.value)}
                          placeholder="e.g. Starting fresh 2028 cycle / Closing out 2027 apps"
                          className="w-full theme-input rounded-xl px-3 py-2"
                        />
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-2.5">
                      {[
                        ["Total Applications", cycleStats.totalApplications],
                        ["Online Assessments", cycleStats.onlineAssessments],
                        ["Video Interviews", cycleStats.videoInterviews],
                        ["Assessment Centres", cycleStats.assessmentCentres]
                      ].map(([l, v]) => (
                        <div key={l} className="glass-card rounded-xl p-3">
                          <div className="text-[11px] text-slate-400">{l}</div>
                          <div className="text-xl font-bold text-white font-mono-num">{v}</div>
                        </div>
                      ))}
                    </div>

                    <p className="text-[11px] text-slate-400">
                      This archives all <strong className="text-white">{rawApps.filter(a => a.category === "internship").length}</strong> internship applications into a read-only snapshot, downloads a JSON backup, and resets the active internship board. Your <strong className="text-white">Part-Time & Flex</strong> roles stay active and untouched.
                    </p>

                    <div className="flex justify-end gap-2 pt-1">
                      <button type="button" onClick={() => setShowForceArchiveModal(false)} className="px-3.5 py-2 rounded-xl text-xs text-slate-400 hover:text-white">
                        Cancel
                      </button>
                      <button type="submit" className="px-4 py-2 rounded-xl text-xs font-bold bg-amber-500 hover:bg-amber-400 text-slate-950 transition">
                        Continue to Step 2 →
                      </button>
                    </div>
                  </>
                ) : (
                  <>
                    <div className="rounded-xl p-3.5 bg-rose-500/10 border border-rose-500/30 space-y-1.5 text-xs text-rose-200">
                      <div className="font-bold flex items-center gap-1.5 text-rose-300">
                        <Icon name="AlertTriangle" className="w-4 h-4" /> Are you sure you want to force-archive "{forceArchiveLabel || "2027 Internship Cycle"}"?
                      </div>
                      <ul className="list-disc pl-5 text-[11px] text-rose-200/90 space-y-1">
                        <li>Saves a read-only snapshot of all {rawApps.filter(a => a.category === "internship").length} internship applications to localStorage.</li>
                        <li>Downloads a permanent backup JSON file to your device.</li>
                        <li>Clears the active internship board and pauses Trackr recommendations (Part-Time roles stay active).</li>
                        <li>You can inspect the read-only archive or click <strong>Reopen Cycle</strong> anytime.</li>
                      </ul>
                    </div>

                    <div className="text-xs">
                      <label className="block text-slate-300 font-semibold mb-1.5">
                        Type <span className="font-mono-num px-1.5 py-0.5 rounded bg-rose-500/20 text-rose-300 border border-rose-500/30">ARCHIVE</span> to confirm
                      </label>
                      <input
                        autoFocus
                        type="text"
                        value={forceArchiveConfirmText}
                        onChange={e => setForceArchiveConfirmText(e.target.value)}
                        placeholder="Type ARCHIVE"
                        className="w-full theme-input rounded-xl px-3 py-2 font-mono-num uppercase"
                      />
                    </div>

                    <div className="flex items-center justify-between pt-1">
                      <button
                        type="button"
                        onClick={() => { setForceArchiveStep(1); setForceArchiveConfirmText(""); }}
                        className="px-3.5 py-2 rounded-xl text-xs text-slate-300 hover:text-white theme-input"
                      >
                        ← Back
                      </button>
                      <div className="flex gap-2">
                        <button type="button" onClick={() => setShowForceArchiveModal(false)} className="px-3.5 py-2 rounded-xl text-xs text-slate-400 hover:text-white">
                          Cancel
                        </button>
                        <button
                          type="submit"
                          disabled={forceArchiveConfirmText.trim().toUpperCase() !== "ARCHIVE"}
                          className="px-4 py-2 rounded-xl text-xs font-bold bg-rose-500 hover:bg-rose-400 disabled:opacity-40 disabled:cursor-not-allowed text-white transition"
                        >
                          Confirm Force Archive
                        </button>
                      </div>
                    </div>
                  </>
                )}
              </form>
            </div>
          )}

          {/* External / Speculative Offer Modal */}
          {showExternalOfferModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4" onClick={() => setShowExternalOfferModal(false)}>
              <form onSubmit={handleAddExternalOffer} className="glass-surface rounded-2xl max-w-lg w-full p-6 space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
                <div className="flex items-center justify-between">
                  <h3 className="text-base font-bold text-white flex items-center gap-2"><Icon name="Gift" className="w-4 h-4 text-lime-400" /> Add External Offer</h3>
                  <button type="button" onClick={() => setShowExternalOfferModal(false)} className="text-slate-400 hover:text-white"><Icon name="X" className="w-5 h-5" /></button>
                </div>
                <p className="text-[11px] text-slate-400">For offers that didn't come through a tracked application, e.g. speculative emails, referrals or employers who approached you directly.</p>
                <div className="grid grid-cols-2 gap-3 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1">Company *</label>
                    <input required type="text" value={externalOffer.company} onChange={e => setExternalOffer({ ...externalOffer, company: e.target.value })} className="w-full theme-input rounded-xl px-3 py-2" />
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1">Sector</label>
                    <input type="text" value={externalOffer.sector} onChange={e => setExternalOffer({ ...externalOffer, sector: e.target.value })} placeholder="e.g. Investment Management" className="w-full theme-input rounded-xl px-3 py-2" />
                  </div>
                </div>
                <div className="text-xs">
                  <label className="block text-slate-400 mb-1">Role Title *</label>
                  <input required type="text" value={externalOffer.role} onChange={e => setExternalOffer({ ...externalOffer, role: e.target.value })} className="w-full theme-input rounded-xl px-3 py-2" />
                </div>
                <div className="grid grid-cols-2 gap-3 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1">How did it come about?</label>
                    <select value={externalOffer.source} onChange={e => setExternalOffer({ ...externalOffer, source: e.target.value })} className="w-full theme-input rounded-xl px-2.5 py-2">
                      {OFFER_SOURCES.map(src => <option key={src} value={src}>{src}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1">Type</label>
                    <select value={externalOffer.category} onChange={e => setExternalOffer({ ...externalOffer, category: e.target.value })} className="w-full theme-input rounded-xl px-2.5 py-2">
                      <option value="internship">2027 Internship / Grad</option>
                      <option value="parttime">Part-Time & Flex</option>
                    </select>
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1">Offer Date</label>
                    <input type="date" value={externalOffer.offerDate} onChange={e => setExternalOffer({ ...externalOffer, offerDate: e.target.value })} className="w-full theme-input rounded-xl px-2.5 py-2 font-mono-num" />
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1">Start Date (optional)</label>
                    <input type="date" value={externalOffer.startDate} onChange={e => setExternalOffer({ ...externalOffer, startDate: e.target.value })} className="w-full theme-input rounded-xl px-2.5 py-2 font-mono-num" />
                  </div>
                </div>
                <div className="text-xs">
                  <label className="block text-slate-400 mb-1">Contact Email / Link (optional)</label>
                  <input type="text" value={externalOffer.contact} onChange={e => setExternalOffer({ ...externalOffer, contact: e.target.value })} placeholder="name@firm.com or https://..." className="w-full theme-input rounded-xl px-3 py-2" />
                </div>
                <div className="text-xs">
                  <label className="block text-slate-400 mb-1">Notes</label>
                  <textarea rows={2} value={externalOffer.notes} onChange={e => setExternalOffer({ ...externalOffer, notes: e.target.value })} className="w-full theme-input rounded-xl px-3 py-2" />
                </div>
                <div className="flex justify-end gap-2 pt-1">
                  <button type="button" onClick={() => setShowExternalOfferModal(false)} className="px-3.5 py-2 rounded-xl text-xs text-slate-400">Cancel</button>
                  <button type="submit" className="px-4 py-2 rounded-xl text-xs font-bold bg-lime-500 hover:bg-lime-400 text-slate-950">Add Offer</button>
                </div>
              </form>
            </div>
          )}

          {/* Cloud Sync Token Settings Modal (Direct iPhone-to-GitHub Save) */}
          {showCloudSyncModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4" onClick={() => setShowCloudSyncModal(false)}>
              <form onSubmit={handleTestAndSaveToken} className="glass-surface rounded-2xl max-w-lg w-full p-6 space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
                <div className="flex items-center justify-between">
                  <h3 className="text-base font-bold text-white flex items-center gap-2">
                    <Icon name="Cloud" className="w-4 h-4 text-emerald-400" /> Cloud Sync Token (Direct iPhone Save)
                  </h3>
                  <button type="button" onClick={() => setShowCloudSyncModal(false)} className="text-slate-400 hover:text-white">
                    <Icon name="X" className="w-5 h-5" />
                  </button>
                </div>

                <p className="text-xs text-slate-300 leading-relaxed">
                  Save a fine-grained GitHub Personal Access Token locally on this device so every edit (clicking <strong>Applied</strong>, changing stages, adding roles/offers, or archiving) automatically pushes <code className="font-mono-num text-emerald-300">state.json</code> and <code className="font-mono-num text-emerald-300">deadlines.ics</code> straight to GitHub — zero Mac required.
                </p>

                <div className="rounded-xl p-3 bg-white/[0.03] border border-white/[0.08] text-[11px] text-slate-300 space-y-1">
                  <div className="font-bold text-white">How to create your token (30 seconds):</div>
                  <div>1. Go to <strong>GitHub → Settings → Developer settings → Fine-grained tokens → Generate new token</strong>.</div>
                  <div>2. Under <strong>Repository access</strong>, select <strong>Only select repositories → grad-tracker-2027</strong>.</div>
                  <div>3. Under <strong>Repository permissions</strong>, set <strong>Contents: Read and write</strong> and <strong>Actions: Read and write</strong>, then paste the token below.</div>
                </div>

                <div className="text-xs">
                  <label className="block text-slate-400 mb-1">GitHub Personal Access Token (stored only in this device&apos;s localStorage)</label>
                  <div className="flex gap-2">
                    <input
                      type={showTokenText ? "text" : "password"}
                      value={tokenDraft}
                      onChange={e => setTokenDraft(e.target.value)}
                      placeholder="github_pat_..."
                      autoComplete="off"
                      className="flex-1 theme-input rounded-xl px-3 py-2 font-mono-num"
                    />
                    <button
                      type="button"
                      onClick={() => setShowTokenText(v => !v)}
                      className="px-3 py-2 rounded-xl theme-input text-slate-300 hover:text-white text-xs font-semibold"
                    >
                      {showTokenText ? "Hide" : "Show"}
                    </button>
                  </div>
                </div>

                <div className="grid grid-cols-3 gap-2 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1">Owner</label>
                    <input
                      type="text"
                      value={configDraft.owner}
                      onChange={e => setConfigDraft({ ...configDraft, owner: e.target.value })}
                      className="w-full theme-input rounded-xl px-2.5 py-1.5 font-mono-num"
                    />
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1">Repository</label>
                    <input
                      type="text"
                      value={configDraft.repo}
                      onChange={e => setConfigDraft({ ...configDraft, repo: e.target.value })}
                      className="w-full theme-input rounded-xl px-2.5 py-1.5 font-mono-num"
                    />
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1">Branch</label>
                    <input
                      type="text"
                      value={configDraft.branch}
                      onChange={e => setConfigDraft({ ...configDraft, branch: e.target.value })}
                      className="w-full theme-input rounded-xl px-2.5 py-1.5 font-mono-num"
                    />
                  </div>
                </div>

                {cloudSyncMsg && (
                  <div className={`text-xs rounded-xl px-3 py-2 border ${
                    cloudSyncStatus === "error"
                      ? "bg-rose-500/10 border-rose-500/30 text-rose-300"
                      : "bg-emerald-500/10 border-emerald-500/30 text-emerald-300"
                  }`}>
                    {cloudSyncMsg}
                  </div>
                )}

                <div className="flex flex-wrap items-center justify-between gap-2 pt-2">
                  <div className="flex items-center gap-2">
                    {ghToken && (
                      <>
                        <button
                          type="button"
                          onClick={() => pushSnapshotToCloud({}, "Manual cloud sync from Rags to Riches")}
                          className="px-3 py-2 rounded-xl text-xs font-semibold theme-input text-emerald-300 hover:text-emerald-200"
                        >
                          Push Now
                        </button>
                        <button
                          type="button"
                          onClick={() => pullFromMasterState({ forceRemote: true, silent: false })}
                          className="px-3 py-2 rounded-xl text-xs font-semibold theme-input text-sky-300 hover:text-sky-200"
                        >
                          Pull Latest
                        </button>
                        <button
                          type="button"
                          onClick={handleRemoveGithubToken}
                          className="px-3 py-2 rounded-xl text-xs text-rose-400 hover:text-rose-300"
                        >
                          Remove
                        </button>
                      </>
                    )}
                  </div>
                  <div className="flex gap-2">
                    <button type="button" onClick={() => setShowCloudSyncModal(false)} className="px-3.5 py-2 rounded-xl text-xs text-slate-400 hover:text-white">
                      Close
                    </button>
                    <button
                      type="submit"
                      disabled={isTestingToken}
                      className="px-4 py-2 rounded-xl text-xs font-bold theme-accent-btn disabled:opacity-50"
                    >
                      {isTestingToken ? "Testing…" : "Test & Save Token"}
                    </button>
                  </div>
                </div>
              </form>
            </div>
          )}

          {/* Add New Role Modal */}
          {showAddModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4" onClick={() => setShowAddModal(false)}>
              <form onSubmit={handleAddApp} className="glass-surface rounded-2xl max-w-lg w-full p-6 space-y-4 shadow-2xl" onClick={e => e.stopPropagation()}>
                <div className="flex items-center justify-between">
                  <h3 className="text-base font-bold text-white">Add New Application</h3>
                  <button type="button" onClick={() => setShowAddModal(false)} className="text-slate-400 hover:text-white">
                    <Icon name="X" className="w-5 h-5" />
                  </button>
                </div>

                <div className="grid grid-cols-2 gap-3 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1">Company *</label>
                    <input required type="text" value={newApp.company} onChange={e => setNewApp({ ...newApp, company: e.target.value })} className="w-full theme-input rounded-xl px-3 py-2" />
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1">Sector</label>
                    <input type="text" value={newApp.sector} onChange={e => setNewApp({ ...newApp, sector: e.target.value })} className="w-full theme-input rounded-xl px-3 py-2" />
                  </div>
                </div>

                <div className="text-xs">
                  <label className="block text-slate-400 mb-1">Role Title *</label>
                  <input required type="text" value={newApp.role} onChange={e => setNewApp({ ...newApp, role: e.target.value })} className="w-full theme-input rounded-xl px-3 py-2" />
                </div>

                <div className="grid grid-cols-2 gap-3 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1">Stage</label>
                    <select value={newApp.stage} onChange={e => setNewApp({ ...newApp, stage: e.target.value })} className="w-full theme-input rounded-xl px-2.5 py-2">
                      {STAGES.map(s => <option key={s.id} value={s.id}>{s.label}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1">Deadline (Optional)</label>
                    <input type="datetime-local" value={newApp.deadline} onChange={e => setNewApp({ ...newApp, deadline: e.target.value })} className="w-full theme-input rounded-xl px-2.5 py-2 font-mono-num" />
                  </div>
                </div>

                {newApp.stage === "Closed / Unsuccessful" && (
                  <div className="text-xs">
                    <label className="block text-rose-400 font-semibold mb-1">Unsuccessful After Which Stage?</label>
                    <select
                      value={newApp.rejectedAfterStage || "CV / Application Screen"}
                      onChange={e => setNewApp({ ...newApp, rejectedAfterStage: e.target.value })}
                      className="w-full theme-input rounded-xl px-2.5 py-2"
                    >
                      {REJECTION_STAGES.map(r => (
                        <option key={r.id} value={r.id}>{r.label}</option>
                      ))}
                    </select>
                  </div>
                )}

                <div className="text-xs">
                  <label className="block text-slate-400 mb-1">Portal / Assessment Link</label>
                  <input type="url" value={newApp.portalLink} onChange={e => setNewApp({ ...newApp, portalLink: e.target.value })} placeholder="https://..." className="w-full theme-input rounded-xl px-3 py-2" />
                </div>

                <div className="text-xs">
                  <label className="block text-slate-400 mb-1">Notes</label>
                  <textarea rows={2} value={newApp.notes} onChange={e => setNewApp({ ...newApp, notes: e.target.value })} className="w-full theme-input rounded-xl px-3 py-2" />
                </div>

                <div className="flex justify-end gap-2 pt-2">
                  <button type="button" onClick={() => setShowAddModal(false)} className="px-3.5 py-2 rounded-xl text-xs text-slate-400">Cancel</button>
                  <button type="submit" className="px-4 py-2 rounded-xl text-xs font-bold theme-accent-btn">Add to Tracker</button>
                </div>
              </form>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        if (location.hostname === "localhost" || location.hostname === "127.0.0.1") {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (r) { r.unregister(); });
          }).catch(function () {});
        } else {
          navigator.serviceWorker.register("./service-worker.js").catch(function () {});
        }
      });
    }
  </script>
</body>
</html>
